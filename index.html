<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f7cff">
<title>Дневник успеваемости</title>
<style>
/* ===== Темы и переменные ===== */
:root{
  --a1:#4f7cff; --a2:#7c5cff; --grad:linear-gradient(135deg,#4f7cff,#7c5cff);
  --bg:#f2f3f8; --card:#ffffff; --card2:#f7f8fc; --text:#1c1c1e; --muted:#6b7280;
  --line:#e4e6ef; --shadow:0 6px 24px rgba(40,50,100,.08); --r:14px; --r2:10px;
  --danger:#ef4444; --ok:#16a34a;
}
:root[data-theme="dark"]{
  --bg:#0e0f14; --card:#1a1c24; --card2:#22252f; --text:#f2f2f7; --muted:#9aa0b4;
  --line:#2c3040; --shadow:0 6px 24px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;transition:background .25s,color .25s}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0}
.hidden{display:none!important}

/* ===== Кнопки и поля ===== */
.btn{border:0;border-radius:var(--r2);padding:9px 14px;background:var(--card2);color:var(--text);cursor:pointer;font-weight:600;transition:transform .08s,opacity .15s,background .15s;border:1px solid var(--line)}
.btn:hover{opacity:.88}.btn:active{transform:scale(.97)}
.btn.primary{background:var(--grad);color:#fff;border-color:transparent}
.btn.danger{background:var(--danger);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:17px;display:inline-flex;align-items:center;justify-content:center}
input,select,textarea{width:100%;padding:10px 12px;border-radius:var(--r2);border:1px solid var(--line);background:var(--card2);outline:none;transition:border .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--a1);box-shadow:0 0 0 3px rgba(79,124,255,.18)}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em}
textarea{resize:vertical}

/* ===== Карточки / панели ===== */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.panel>h3{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.muted{color:var(--muted)}.small{font-size:13px}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;color:#fff;background:var(--muted)}
.badge.super_admin{background:var(--grad)}.badge.admin{background:#2563eb}.badge.student{background:#16a34a}.badge.viewer{background:#6b7280}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.sb{justify-content:space-between}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv:last-child{border:0}

/* ===== Шапка и вкладки ===== */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff}
.brand b{display:block;line-height:1.1}.brand small{color:var(--muted)}
.top-mid{flex:1;min-width:160px;display:flex;gap:6px;align-items:center;max-width:420px}
.top-mid select{padding:8px 10px}
.stname{font-weight:700}
.avg{display:flex;flex-direction:column;align-items:center;line-height:1;padding:4px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--line)}
.avg b{font-size:22px}.avg small{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.top-r{margin-left:auto;display:flex;gap:8px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block}.dot.dirty{background:#f59e0b}
.tabs{display:flex;gap:6px;padding:10px 16px 0;overflow-x:auto;max-width:1280px;margin:0 auto}
.tab{border:0;background:transparent;padding:9px 16px;border-radius:99px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.tab.on{background:var(--grad);color:#fff}
.tab .cnt{background:#ef4444;color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:6px}
main{max-width:1280px;margin:0 auto;padding:14px 16px 60px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.toolbar .sp{flex:1}

/* ===== Оценки ===== */
.grades{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.gh,.subj-row{display:grid;grid-template-columns:240px 1fr}
.gh{padding:10px 14px;background:var(--card2);font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line)}
.subj-row{border-bottom:1px solid var(--line)}.subj-row:last-child{border:0}
.subj-head{padding:12px 14px;display:flex;flex-direction:column;gap:6px;justify-content:center}
.subj-name{font-weight:700;font-size:16px;word-break:break-word}
.subj-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.avgpill{padding:2px 10px;border-radius:99px;color:#fff;font-weight:700;font-size:13px;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.mini{border:1px solid var(--line);background:var(--card2);border-radius:8px;width:26px;height:26px;cursor:pointer;font-size:11px;padding:0;color:var(--muted)}
.mini:hover{color:var(--text)}
.subj-cells{padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.g{width:48px;height:48px;border-radius:12px;border:0;color:#fff;font-size:22px;font-weight:800;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.28);transition:transform .1s}
.g:hover{transform:translateY(-2px)}
.g.typed{width:auto;min-width:54px;padding:4px 8px;background:var(--card2)!important;border:2px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:16px;text-shadow:none;line-height:1}
.g.typed .gv{font-size:16px;font-weight:800}
.g.typed .gb{font-size:10px;font-weight:800;padding:1px 6px;border-radius:99px;color:#fff;letter-spacing:.02em}
.g.add{background:transparent;border:2px dashed var(--line);color:var(--muted);text-shadow:none;font-size:24px;font-weight:400}
.g.add:hover{border-color:var(--a1);color:var(--a1)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
@media(max-width:820px){
  .gh{display:none}
  .grades{background:transparent;border:0;box-shadow:none;overflow:visible}
  .subj-row{grid-template-columns:1fr;background:var(--card);border:1px solid var(--line)!important;border-radius:var(--r);margin-bottom:10px;box-shadow:var(--shadow)}
  .subj-head{flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-bottom:0}
}

/* ===== Расписание ===== */
.sch-wrap{overflow-x:auto;padding-bottom:6px}
.sch{display:grid;grid-template-columns:repeat(6,minmax(210px,1fr));gap:10px;min-width:1260px}
@media(min-width:1300px){.sch{min-width:0}}
.day{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:160px;transition:background .15s,border .15s}
.day.over{border-color:var(--a1);background:color-mix(in srgb,var(--a1) 8%,var(--card))}
.day h4{margin:0 0 2px;font-size:14px;text-align:center;padding-bottom:6px;border-bottom:1px solid var(--line)}
.lesson{background:var(--card2);border:1px solid var(--line);border-left:4px solid var(--a1);border-radius:10px;padding:8px 10px;cursor:pointer}
.lesson[draggable=true]{cursor:grab}
.lesson.drag{opacity:.4}
.lesson .lt{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.lesson .ls{font-weight:700;margin:2px 0}
.lesson .hw{font-size:12.5px;margin-top:4px;padding-top:4px;border-top:1px dashed var(--line);color:var(--muted);white-space:pre-wrap;word-break:break-word}
.day .addl{margin-top:auto}

/* ===== Кабинет ===== */
.cab{display:grid;grid-template-columns:320px 1fr;gap:14px;align-items:start}
@media(max-width:900px){.cab{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:13px}
.chip button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0;font-size:14px}
.chip.f{cursor:pointer;font-weight:600}.chip.f.on{background:var(--grad);color:#fff;border-color:transparent}
.bar{display:grid;grid-template-columns:130px 1fr 44px;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.bar .tr{height:10px;border-radius:99px;background:var(--card2);overflow:hidden;border:1px solid var(--line)}
.bar .fl{height:100%;border-radius:99px}
.req{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.req .rt{flex:1;min-width:220px}.req .rt b{display:block}
.reqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:0 12px}
@media(max-width:480px){.reqs{grid-template-columns:1fr}}

/* ===== Пользователи ===== */
table.ut{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
.ut th,.ut td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}
.ut th{background:var(--card2);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ut select{width:auto;padding:6px 8px}
@media(max-width:820px){
  .ut,.ut tbody,.ut tr,.ut td{display:block;width:100%}.ut thead{display:none}
  .ut tr{padding:10px;border-bottom:1px solid var(--line)}
  .ut td{border:0;padding:3px 0}.ut td::before{content:attr(data-l)": ";color:var(--muted);font-size:12px}
}

/* ===== Авторизация ===== */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth .box{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:var(--shadow)}
.auth .brand{justify-content:center;margin-bottom:16px;flex-direction:column;text-align:center}
.auth .logo{width:56px;height:56px;font-size:28px;border-radius:18px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;margin-bottom:8px}
.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.err{color:var(--danger);font-size:13px;min-height:18px;margin-top:8px}
.link{background:none;border:0;color:var(--a1);cursor:pointer;padding:6px 0;font-weight:600}

/* ===== Модалки, тосты, tooltip ===== */
.ov{position:fixed;inset:0;background:rgba(10,12,24,.5);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.modal{background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:440px;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.modal.wide{max-width:640px}
.modal h3{margin-bottom:6px;font-size:18px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.mbody p{margin:8px 0;white-space:pre-line}
.codebox{font-size:34px;letter-spacing:.3em;text-align:center;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding:6px 0}
#toasts{position:fixed;left:0;right:0;bottom:18px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:200;pointer-events:none;padding:0 12px}
.toast{background:#1c1c1e;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:fade .2s;max-width:480px}
.toast.err{background:#b91c1c}.toast.ok{background:#15803d}
.tip{position:fixed;z-index:300;display:none;background:#1c1c1e;color:#fff;padding:7px 11px;border-radius:10px;font-size:13px;line-height:1.35;max-width:260px;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.35);white-space:pre-line}
.tip::after{content:"";position:absolute;left:var(--ax,50%);bottom:-5px;width:10px;height:10px;background:#1c1c1e;transform:translateX(-50%) rotate(45deg);border-radius:2px}
.tip.below::after{bottom:auto;top:-5px}
:root[data-theme="dark"] .tip,:root[data-theme="dark"] .tip::after{background:#3a3d4d}
@keyframes fade{from{opacity:0}to{opacity:1}}
</style>
</head>

function modal({ title, body, buttons = [], wide = false, dismiss = true, onClose }) {
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="modal${wide ? ' wide' : ''}" role="dialog"><h3>${esc(title)}</h3><div class="mbody">${body}</div><div class="mfoot"></div></div>`;
  const foot = ov.querySelector('.mfoot');
  const close = () => { if (!ov.isConnected) return; ov.remove(); onClose && onClose(); };
  buttons.forEach(b => {
    const el = document.createElement('button'); el.className = 'btn ' + (b.cls || ''); el.textContent = b.label;
    el.onclick = async () => { const r = b.onClick ? await b.onClick(ov, close) : undefined; if (r !== false) close(); };

  if (dismiss) ov.addEventListener('mousedown', e => { if (e.target === ov) close(); });
  document.body.appendChild(ov);
  const f = ov.querySelector('input,select,textarea'); if (f) setTimeout(() => f.focus(), 30);

}
function ask(msg, { ok = 'OK', cancel = 'Отмена', danger = false, title = 'Подтверждение', dismiss = true } = {}) {

    let done = false; const fin = v => { if (!done) { done = true; res(v); } };
    modal({ title, body: `<p>${esc(msg)}</p>`, dismiss, onClose: () => fin(false),

}

      onClose: () => fin(null),

/* ==========================================================================
   GitHub API, слияние данных, публикация

async function ghApi(method, url, token, body) {
  const r = await fetch('https://api.github.com' + url, {
    method, cache: 'no-store',
    headers: Object.assign({ 'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + token, 'X-GitHub-Api-Version': '2022-11-28' }, body ? { 'Content-Type': 'application/json' } : {}),
    body: body ? JSON.stringify(body) : undefined

  if (!r.ok) { const e = new Error('GitHub ' + r.status); e.status = r.status; try { e.data = await r.json(); } catch (_) { } throw e; }
  return r.status === 204 ? null : r.json();
}
// Читает JSON-файл из репозитория. Возвращает {json, sha} или null, если файла нет.
async function ghGet(owner, repo, path, token) {
  try {
    const j = await ghApi('GET', `/repos/${owner}/${repo}/contents/${encodeURIComponent(path)}?t=${Date.now()}`, token);
    return { json: JSON.parse(b64dec(j.content || '') || 'null'), sha: j.sha };
  } catch (e) { if (e.status === 404) return null; throw e; }
}
async function ghPut(owner, repo, path, token, obj, sha, msg) {
  return ghApi('PUT', `/repos/${owner}/${repo}/contents/${encodeURIComponent(path)}`, token,
    { message: msg || 'update', content: b64enc(JSON.stringify(obj, null, 2)), ...(sha ? { sha } : {}) });
}
const adminToken = () => lsRaw(LS.token) || '';

/* ===== Слияние: «последняя правка побеждает» по updatedAt ===== */
function mergeLWW(a, b, keyFn, stampFn) {
  const m = new Map();
  [...a, ...b].forEach(x => { const k = keyFn(x), o = m.get(k); if (!o || stampFn(x) > stampFn(o)) m.set(k, x); });
  return [...m.values()];
}
const stStamp = s => s.updatedAt || s.createdAt || '';
const usStamp = u => u.updatedAt || u.createdAt || '';
const inviteMine = i => isSuper(ME) || i.invitedBy === ME.email;

// Принять данные с GitHub в локальное состояние
function receiveRemote(remote) {
  const rs = (Array.isArray(remote.students) ? remote.students : []).map(fixStudent);
  const ru = Array.isArray(remote.users) ? remote.users : [];
  const rdel = Array.isArray(remote.deletedEmails) ? remote.deletedEmails : [];
  const rinv = Array.isArray(remote.invites) ? remote.invites : [];
  const before = JSON.stringify([S.students, USERS, S.invites, S.deletedEmails]);
  if (ME && isAdm(ME)) {
    // админ: свои неопубликованные правки (новее) сохраняются
    S.students = mergeLWW(rs, S.students, s => s.id, stStamp);
    S.invites = rinv.filter(i => !inviteMine(i)).concat(S.invites.filter(inviteMine));
  } else {
    // ученик/наблюдатель: данные с GitHub главнее; своя (ещё не одобренная) карточка ученика сохраняется
    const keep = ME && !rs.find(s => s.id === ME.studentId) ? S.students.filter(s => s.id === ME.studentId) : [];
    S.students = rs.concat(keep);
    S.invites = rinv;
  }
  S.deletedEmails = [...new Set([...rdel, ...S.deletedEmails.filter(e => !rdel.includes(e) && ME && isAdm(ME))])];
  const delSet = new Set(S.deletedEmails.map(normEmail));
  let users = mergeLWW(ru, USERS, u => normEmail(u.email), usStamp).filter(u => !delSet.has(normEmail(u.email)));
  if (!(ME && isAdm(ME))) { // «чужие» локальные записи без подтверждения не нужны — оставляем только себя
    users = users.filter(u => ru.find(r => normEmail(r.email) === normEmail(u.email)) || (ME && normEmail(u.email) === normEmail(ME.email)));
  }
  USERS = users; S.publishedAt = remote.publishedAt || S.publishedAt;
  ensureSuperAdmin(); saveLocal();
  if (ME) { const m = USERS.find(u => u.uid === ME.uid || normEmail(u.email) === normEmail(ME.email)); if (m) ME = m; }
  return before !== JSON.stringify([S.students, USERS, S.invites, S.deletedEmails]);
}

    if (!remote) { const r = await fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' }); if (r.ok) remote = await r.json(); }

// Собрать файл для публикации: слияние с тем, что сейчас лежит на GitHub
function buildPublic(remote) {
  remote = remote || {};
  const rs = (Array.isArray(remote.students) ? remote.students : []).map(fixStudent);
  const students = mergeLWW(rs, S.students, s => s.id, stStamp);
  const deleted = [...new Set([...(remote.deletedEmails || []), ...S.deletedEmails])].filter(e => !unblocked.has(normEmail(e)));
  const delSet = new Set(deleted.map(normEmail));

  const invites = (Array.isArray(remote.invites) ? remote.invites : []).filter(i => !inviteMine(i)).concat(S.invites.filter(inviteMine));

  if (pubBusy) { clearTimeout(pubTimer); pubTimer = setTimeout(() => publishToGitHubSilent({ force }), 1500); return false; }

  for (let i = 0; i < 4; i++) {
    const cur = await ghGet(P.owner, P.repo, P.file, P.token);
    let list = cur && Array.isArray(cur.json) ? cur.json : [];
    list = mut(list) || list;
    const lim = Date.now() - 3 * 864e5; // обработанные заявки храним 3 дня
    list = list.filter(r => r.status === 'pending' || new Date(r.processedAt || r.createdAt).getTime() > lim);
    try { await ghPut(P.owner, P.repo, P.file, P.token, list, cur ? cur.sha : undefined, 'pending'); return list; }
    catch (e) { if ((e.status === 409 || e.status === 422) && i < 3) { await sleep(350 * (i + 1)); continue; } throw e; }
  }
  throw new Error('Конфликт записи заявки');
}

function describeReq(r) {

/* ===== Применение операций к ученику (одни и те же для прямых правок и заявок) ===== */
function applyGradeOp(st, p) {
  let sub = st.subjects.find(s => s.name === p.subjectName);
  if (!sub) { if (p.op !== 'add') return false; sub = { id: uid(), name: p.subjectName, order: st.subjects.length, grades: [] }; st.subjects.push(sub); }
  const i = sub.grades.findIndex(g => g.id === p.gradeId);
  if (p.op === 'delete') { if (i >= 0) sub.grades.splice(i, 1); }
  else {
    const g = Object.assign({ createdAt: nowIso() }, i >= 0 ? sub.grades[i] : {}, p.grade, { id: p.gradeId });
    if (i >= 0) sub.grades[i] = g; else sub.grades.push(g);
  }
  sortSub(sub); touch(st); return true;
}
function applyScheduleOp(st, p) {
  const l = p.lesson || {}; const i = st.schedule.findIndex(x => x.id === l.id);
  if (p.op === 'delete') { if (i >= 0) st.schedule.splice(i, 1); }
  else if (p.op === 'add' || p.op === 'edit') {
    if (i >= 0) Object.assign(st.schedule[i], l);
    else { // новый урок встаёт в день по времени
      const idx = st.schedule.findIndex(x => x.day === l.day && l.time && x.time && x.time > l.time);
      if (idx >= 0) st.schedule.splice(idx, 0, l); else st.schedule.push(l);
    }
  } else if (p.op === 'move') {
    if (i < 0) return false; const [it] = st.schedule.splice(i, 1); it.day = l.day;
    const b = p.beforeId ? st.schedule.findIndex(x => x.id === p.beforeId) : -1;
    if (b >= 0) st.schedule.splice(b, 0, it);
    else { let last = -1; st.schedule.forEach((x, k) => { if (x.day === it.day) last = k; }); st.schedule.splice(last + 1, 0, it); }
  }
  touch(st); return true;
}
function applyCatalogOp(st, p) {
  if (p.op === 'add') { if (!st.catalog.includes(p.name)) st.catalog.push(p.name); }
  else st.catalog = st.catalog.filter(x => x !== p.name);
  touch(st); return true;
}

const findInvite = email => S.invites.find(i => normEmail(i.email) === normEmail(email) && !i.usedAt);
function roleFromInvite(inv) {
  if (!inv) return 'viewer';
  if (inv.role === 'admin') return inv.invitedBy === normEmail(SUPER_ADMIN_EMAIL) ? 'admin' : 'student'; // админов назначает только супер-админ
  return ['student', 'viewer'].includes(inv.role) ? inv.role : 'viewer';
}

// Применение заявки админом. Возвращает {ok, msg}
function applyRequest(r) {
  const p = r.payload || {};
  if (r.type === 'new_user' || r.type === 'new_student') {
    const email = normEmail(p.user.email);
    if (S.deletedEmails.map(normEmail).includes(email)) return { ok: false, msg: 'Этот email в чёрном списке' };
    let st = null;
    if (p.student) {
      st = stById(p.student.id) || S.students.find(s => normalizeName(s.studentName) === normalizeName(p.student.studentName));
      if (!st) { st = fixStudent(Object.assign({}, p.student)); S.students.push(st); }
    } else st = stById(p.user.studentId);
    if (!st) return { ok: false, msg: 'Ученик не найден' };
    const inv = findInvite(email) || S.invites.find(i => normEmail(i.email) === email);
    const role = roleFromInvite(inv);
    if (!USERS.find(u => normEmail(u.email) === email))
      USERS.push({ uid: p.user.uid, email, name: p.user.name, role, studentId: st.id, salt: p.user.salt, passwordHash: p.user.passwordHash, createdAt: p.user.createdAt, updatedAt: nowIso() });
    if (inv) inv.usedAt = nowIso();
    touch(st); return { ok: true };
  }
  if (r.type === 'password') {
    const u = USERS.find(x => normEmail(x.email) === normEmail(p.email));
    if (!u || u.role === 'super_admin') return { ok: false, msg: 'Пользователь не найден' };
    u.salt = p.salt; u.passwordHash = p.passwordHash; u.updatedAt = nowIso(); return { ok: true };
  }
  const st = stById(r.studentId); if (!st) return { ok: false, msg: 'Ученик не найден (обновите данные)' };
  if (!manages(st)) return { ok: false, msg: 'Это не ваш ученик' };
  if (r.type === 'grade') applyGradeOp(st, p); else if (r.type === 'schedule') applyScheduleOp(st, p); else if (r.type === 'catalog') applyCatalogOp(st, p);
  return { ok: true };
}
async function approveRequest(id) {

const emailConfigured = () => !/xxx/i.test(EMAILJS.serviceId + EMAILJS.templateId + EMAILJS.publicKey);
function genCode() { const a = new Uint32Array(1); (window.crypto || {}).getRandomValues ? crypto.getRandomValues(a) : (a[0] = Math.random() * 4e9); return 100 + (a[0] % 900); }
async function sendCode(email, name, code) {
  if (!emailConfigured()) return false;
  try {
    const r = await fetch('https://api.emailjs.com/api/v1.0/email/send', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ service_id: EMAILJS.serviceId, template_id: EMAILJS.templateId, user_id: EMAILJS.publicKey, template_params: { to_email: email, to_name: name || email, code: String(code), passcode: String(code) } }) });
    return r.ok;
  } catch (e) { return false; }
}
// Универсальное окно ввода 3-значного кода: 5 попыток, 10 минут
function verifyCodeDialog(key, v, mailed) {
  return new Promise(res => {
    let done = false; const fin = x => { if (!done) { done = true; res(x); } };
    const m = modal({ title: 'Подтверждение email', dismiss: false, onClose: () => fin(false),
      body: `${mailed ? `<p>Код отправлен на <b>${esc(v.email)}</b>.</p>` : `<p class="muted small">Отправка писем (EmailJS) не настроена — код показан на экране:</p><div class="codebox">${v.code}</div>`}
        <label>Введите 3-значный код</label><input id="_code" inputmode="numeric" maxlength="3" autocomplete="one-time-code"><div class="err" id="_cerr"></div>`,
      buttons: [{ label: 'Отмена', cls: 'ghost', onClick: () => { lsDel(key); fin(false); } },
        { label: 'Подтвердить', cls: 'primary', onClick: o => {
          const cur = lsGet(key, null), err = $('#_cerr', o);
          if (!cur || Date.now() > cur.expires) { lsDel(key); err.textContent = 'Код устарел. Начните заново.'; setTimeout(() => { fin(false); m.close(); }, 1200); return false; }
          if (String($('#_code', o).value.trim()) === String(cur.code)) { lsDel(key); fin(true); return true; }
          cur.attempts = (cur.attempts || 0) + 1; lsSet(key, cur);
          if (cur.attempts >= 5) { lsDel(key); err.textContent = 'Слишком много попыток.'; setTimeout(() => { fin(false); m.close(); }, 1200); return false; }
          err.textContent = `Неверный код. Осталось попыток: ${5 - cur.attempts}`; return false;
        } }] });
  });
}
async function doLogin(email, pwd) {
  email = normEmail(email); if (!email || !pwd) return 'Введите email и пароль';
  let u = USERS.find(x => normEmail(x.email) === email);
  if (!u) { await loadPublishedData(); u = USERS.find(x => normEmail(x.email) === email); }
  if (S.deletedEmails.map(normEmail).includes(email)) return 'Аккаунт удалён администратором';
  if (!u) return 'Пользователь не найден. Если вы только зарегистрировались — дождитесь одобрения администратора.';
  const h = await hashPwd(u.salt, pwd);
  if (h !== u.passwordHash) return 'Неверный пароль';
  lsSet(LS.session, { email }); ME = u; curId = lsGet(LS.cur, null); afterLogin(); return '';
}

async function startRegister(email, pwd, name) {
  email = normEmail(email); name = String(name || '').trim().replace(/\s+/g, ' ');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return 'Некорректный email';
  if (pwd.length < 6) return 'Пароль — не короче 6 символов';
  if (name.length < 3) return 'Введите ФИО ученика';
  if (email === normEmail(SUPER_ADMIN_EMAIL)) return 'Этот email зарезервирован за супер-администратором — используйте «Войти»';
  await loadPublishedData();
  if (S.deletedEmails.map(normEmail).includes(email)) return 'Этот email заблокирован администратором';
  if (USERS.find(u => normEmail(u.email) === email)) return 'Этот email уже зарегистрирован';
  const salt = uid() + uid(), hash = await hashPwd(salt, pwd), code = genCode();
  const v = { email, name, salt, hash, code, expires: Date.now() + 10 * 60 * 1000, attempts: 0 };
  lsSet(LS.vReg, v);
  const mailed = await sendCode(email, name, code);
  if (!(await verifyCodeDialog(LS.vReg, v, mailed))) return 'Регистрация отменена';
  await finalizeRegistration(v); return '';
}
async function finalizeRegistration(v) {
  const inv = findInvite(v.email); const role = roleFromInvite(inv);
  let st = inv && inv.studentId ? stById(inv.studentId) : null;
  if (!st) st = S.students.find(s => normalizeName(s.studentName) === normalizeName(v.name)); // поиск по нормализованному ФИО
  let isNew = false;
  if (!st) { isNew = true; st = newStudent(v.name, role === 'admin' ? v.email : (inv ? inv.invitedBy : 'self')); S.students.push(st); }
  const user = { uid: uid(), email: v.email, name: v.name, role, studentId: st.id, salt: v.salt, passwordHash: v.hash, createdAt: nowIso(), updatedAt: nowIso() };
  USERS.push(user); saveLocal();
  lsSet(LS.session, { email: v.email }); ME = user; curId = st.id; afterLogin();
  // Заявка на подтверждение регистрации
  if (pendingReady()) {
    const ok = await sendRequest(isNew ? 'new_student' : 'new_user', st, { user: { uid: user.uid, email: user.email, name: user.name, studentId: st.id, salt: user.salt, passwordHash: user.passwordHash, createdAt: user.createdAt }, student: isNew ? st : null });
    if (ok) toast('📤 Заявка отправлена администратору', 'ok');
  } else toast('Токен заявок не настроен: регистрация сохранена только на этом устройстве', 'err');
}
async function forgotPassword() {
  const email = normEmail(await askText('Сброс пароля', 'Email аккаунта', { ok: 'Далее' })); if (!email) return;
  if (email === normEmail(SUPER_ADMIN_EMAIL)) return notice('Пароль супер-администратора меняется только в коде (SUPER_ADMIN_PASSWORD_HASH).');
  await loadPublishedData();
  const u = USERS.find(x => normEmail(x.email) === email); if (!u) return notice('Пользователь не найден');
  const code = genCode(), v = { email, code, expires: Date.now() + 10 * 60 * 1000, attempts: 0 }; lsSet(LS.vRes, v);
  const mailed = await sendCode(email, u.name, code);
  if (!(await verifyCodeDialog(LS.vRes, v, mailed))) return;
  const p1 = await askText('Новый пароль', 'Новый пароль (от 6 символов)', { type: 'password', ok: 'Сохранить' }); if (!p1) return;

}

function pdfSchedule() {
  const st = curStudent(); if (!st) return;
  const el = document.createElement('div'); el.style.cssText = 'font-family:Arial,Helvetica,sans-serif;color:#111;width:277mm;background:#fff';
  el.innerHTML = `<h2 style="margin:0 0 4px">Расписание уроков</h2><div style="color:#555;margin-bottom:10px">Ученик: <b>${esc(st.studentName)}</b> · ${fmtDate(today())}</div>
    <table style="width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed"><tr>${DAYS.map(d => `<th style="background:#eef0f7;padding:6px;border:1px solid #d5d8e5">${d}</th>`).join('')}</tr>
    <tr>${DAYS.map(d => `<td style="vertical-align:top;padding:5px;border:1px solid #d5d8e5">${st.schedule.filter(l => l.day === d).map(l => `<div style="margin-bottom:6px;padding:5px;border-left:3px solid #4f7cff;background:#f6f7fb"><div style="color:#666">${esc(l.time)}${l.room ? ' · каб. ' + esc(l.room) : ''}</div><div style="font-weight:700">${esc(l.subject)}</div>${l.homework ? `<div style="color:#444;margin-top:2px">ДЗ: ${esc(l.homework)}</div>` : ''}</div>`).join('') || '<span style="color:#aaa">—</span>'}</td>`).join('')}</tr></table>`;
  savePdf(el, pdfName('raspisanie', st), 'landscape');
}

/* ==========================================================================
   Действия (делегирование событий)
   ========================================================================== */
const ACT = {
  theme: toggleTheme, logout,
  tab: t => { tab = t.dataset.tab; render(); },
  authtab: t => { authDraft.email = ($('#a_email') || {}).value || ''; authDraft.name = ($('#a_name') || {}).value || ''; authMode = t.dataset.m; render(); },
  login: async () => { const e = $('#a_err'); e.textContent = ''; const err = await doLogin($('#a_email').value, $('#a_pwd').value); if (err) e.textContent = err; },
  register: async () => {
    authDraft.email = $('#a_email').value; authDraft.name = $('#a_name').value; const e = $('#a_err'); e.textContent = '';
    const err = await startRegister($('#a_email').value, $('#a_pwd').value, $('#a_name').value); if (err && $('#a_err')) $('#a_err').textContent = err;
  },
  forgot: forgotPassword,
  'student-add': async () => {
    const name = await askText('Новый ученик', 'ФИО ученика', { placeholder: 'Иванов Иван', ok: 'Добавить' }); if (!name) return;
    const ex = S.students.find(s => normalizeName(s.studentName) === normalizeName(name));
    if (ex) { if (visibleStudents().includes(ex)) { curId = ex.id; lsSet(LS.cur, curId); render(); return toast('Такой ученик уже есть — выбран'); } return notice('Ученик с таким ФИО уже есть у другого администратора.'); }
    const st = newStudent(name, ME.email); S.students.push(st); curId = st.id; lsSet(LS.cur, curId); commit(st);
  },
  'name-save': () => {
    const st = curStudent(), v = $('#st_name').value.trim().replace(/\s+/g, ' '); if (!st || v.length < 3) return toast('Слишком короткое ФИО', 'err');
    const dup = S.students.find(s => s.id !== st.id && normalizeName(s.studentName) === normalizeName(v)); if (dup) return toast('Ученик с таким ФИО уже существует', 'err');
    st.studentName = v; commit(st); toast('ФИО сохранено', 'ok');
  },
  'sub-add': () => {
    const st = curStudent(), have = new Set(st.subjects.map(s => s.name)), opts = st.catalog.filter(c => !have.has(c));
    if (!opts.length) return notice('Все предметы из каталога уже добавлены. Добавьте новые предметы в каталог (Личный кабинет).');
    modal({ title: 'Добавить предмет', body: `<label>Из каталога</label><select id="sa">${opts.map(o => `<option>${esc(o)}</option>`).join('')}</select>`,
      buttons: [{ label: 'Отмена', cls: 'ghost' }, { label: 'Добавить', cls: 'primary', onClick: o => { st.subjects.push({ id: uid(), name: $('#sa', o).value, order: st.subjects.length, grades: [] }); commit(st); } }] });
  },
  'sub-up': t => moveSubject(t.dataset.sub, -1), 'sub-down': t => moveSubject(t.dataset.sub, 1),
  'sub-del': async t => {
    const st = curStudent(), s = st.subjects.find(x => x.id === t.dataset.sub);
    if (!(await ask(`Удалить предмет «${s.name}» вместе со всеми оценками?`, { ok: 'Удалить', danger: true }))) return;
    st.subjects = st.subjects.filter(x => x !== s); subjectsSorted(st).forEach((x, i) => x.order = i); commit(st);
  },
  'grade-add': t => gradeModal(t.dataset.sub, null),
  'grade-edit': t => { if (longPressed) { longPressed = false; return; } if (!canEdit()) { showTip(t, gradeTipHtml(t)); setTimeout(hideTip, 3000); return; } gradeModal(t.dataset.sub, t.dataset.id); },
  'les-add': t => lessonModal(t.dataset.day, null),
  'les-edit': t => { if (canEdit()) lessonModal(null, t.dataset.lid); },
  'pdf-grades': pdfGrades, 'pdf-sched': pdfSchedule,
  'pub-quick': async () => { if (!(await ensureToken())) return; toast('Публикация…'); const ok = await publishToGitHubSilent(); if (ok) { toast('Опубликовано ✓', 'ok'); render(); } },
  publish: publishToGitHub, sync: syncFromGitHub,
  'forget-token': async () => { if (await ask('Удалить токен GitHub с этого устройства?', { ok: 'Удалить' })) { lsDel(LS.token); toast('Токен удалён'); render(); } },
  export: () => {
    const all = isAdm(ME) ? { students: isSuper(ME) ? S.students : visibleStudents(), users: visibleUsers(), invites: S.invites.filter(inviteMine), deletedEmails: S.deletedEmails } : { students: visibleStudents() };
    downloadText(`school-backup-${today()}.json`, 'application/json', JSON.stringify(Object.assign({ exportedAt: nowIso() }, all), null, 2));
  },
  import: () => { const f = $('#impf'); f.value = ''; f.click(); },
  reset: resetAll,
  'cat-add': () => { const v = $('#cat_in').value.trim(); if (!v) return; const st = curStudent(); if (st.catalog.some(c => c.toLowerCase() === v.toLowerCase())) return toast('Такой предмет уже есть', 'err'); doCatalogOp({ op: 'add', name: v }); },
  'cat-del': t => doCatalogOp({ op: 'remove', name: t.dataset.name }),
  'req-approve': t => approveRequest(t.dataset.id), 'req-reject': t => rejectRequest(t.dataset.id),
  'req-filter': t => { reqFilter = t.dataset.f; render(); },
  'inv-create': () => {
    const email = normEmail($('#inv_email').value), role = $('#inv_role').value, sid = $('#inv_st').value, st = stById(sid);
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast('Некорректный email', 'err'); if (!st) return toast('Выберите ученика', 'err');
    if (email === normEmail(SUPER_ADMIN_EMAIL)) return toast('Этот email зарезервирован', 'err');
    if (role === 'admin' && !isSuper(ME)) return toast('Админов приглашает только супер-админ', 'err');
    S.invites = S.invites.filter(i => !(normEmail(i.email) === email && !i.usedAt));
    S.deletedEmails = S.deletedEmails.filter(e => normEmail(e) !== email); unblocked.add(email); // повторное приглашение снимает блокировку
    S.invites.push({ id: uid(), email, role, studentId: st.id, studentName: st.studentName, invitedBy: ME.email, createdAt: nowIso() });
    saveLocal(); render(); schedulePublish(); toast('Приглашение создано', 'ok');
  },
  'inv-dl': t => { const i = S.invites.find(x => x.id === t.dataset.id); if (i) downloadText(`invite-${i.email}.json`, 'application/json', JSON.stringify({ type: 'school-invite', app: location.href.split('#')[0], ...i }, null, 2)); },
  'inv-del': async t => { if (!(await ask('Удалить приглашение?', { ok: 'Удалить', danger: true }))) return; S.invites = S.invites.filter(i => i.id !== t.dataset.id); saveLocal(); render(); schedulePublish(); },
  'user-del': async t => {
    const u = USERS.find(x => x.uid === t.dataset.uid); if (!u) return;
    if (u.email === ME.email) return toast('Себя удалить нельзя', 'err');
    if (u.role === 'super_admin') return toast('Супер-админа удалить нельзя', 'err');
    if (u.role === 'admin' && !isSuper(ME)) return toast('Удалять админов может только супер-админ', 'err');
    if (u.role === 'admin' && USERS.filter(x => x.role === 'admin' || x.role === 'super_admin').length < 2) return toast('Нельзя удалить последнего админа', 'err');
    if (!(await ask(`Удалить аккаунт ${u.email}? Email попадёт в чёрный список.`, { ok: 'Удалить', danger: true }))) return;
    USERS = USERS.filter(x => x !== u); S.deletedEmails.push(normEmail(u.email)); unblocked.delete(normEmail(u.email)); saveLocal(); render(); schedulePublish();
  }
};
function moveSubject(id, d) {
  const st = curStudent(), l = subjectsSorted(st), i = l.findIndex(s => s.id === id), j = i + d; if (j < 0 || j >= l.length) return;
  [l[i], l[j]] = [l[j], l[i]]; l.forEach((s, k) => s.order = k); commit(st);
}
async function resetAll() {
  const sup = isSuper(ME);
  const m1 = `⚠️ ВНИМАНИЕ!\n\nВы собираетесь удалить ВСЕ данные приложения${sup ? '' : ' ваших учеников'}:\n• Все оценки ${sup ? 'всех' : 'ваших'} учеников\n• Всё расписание\n• Весь каталог предметов\n• Все приглашения\n• Все данные учеников (кроме аккаунтов пользователей)\n• Файл data.json на GitHub будет перезаписан\n\nДействие НЕОБРАТИМО.\nПродолжить?`;
  if (!(await ask(m1, { ok: 'Продолжить', title: '⚠️ Сброс данных', danger: true, dismiss: false }))) return;
  if (!(await ask('🚨 ПОСЛЕДНЕЕ ПРЕДУПРЕЖДЕНИЕ\n\nВСЕ ДАННЫЕ БУДУТ УДАЛЕНЫ НАВСЕГДА.\nОтменить это будет невозможно.\n\nВы ТОЧНО уверены?', { ok: 'Да, удалить всё', cancel: 'Отмена', title: '🚨 Последнее предупреждение', danger: true, dismiss: false }))) return;
  S.students.filter(s => sup || s.createdBy === ME.email).forEach(s => { s.subjects = []; s.schedule = []; s.catalog = []; touch(s); });
  S.invites = sup ? [] : S.invites.filter(i => !inviteMine(i));
  saveLocal(); render();
  if (!(await ensureToken())) { toast('Данные сброшены локально. Введите токен и нажмите «Опубликовать», чтобы сбросить на GitHub.', 'err'); return; }
  if (await publishToGitHubSilent()) toast('Все данные сброшены и опубликованы', 'ok');
}

// change-события (select, file)
document.addEventListener('change', async e => {
  const t = e.target, k = t.dataset && t.dataset.change; if (!k) return;
  if (k === 'stsel') { curId = t.value; lsSet(LS.cur, curId); render(); }
  else if (k === 'role') {
    const u = USERS.find(x => x.uid === t.dataset.uid); if (!u || u.email === ME.email || u.role === 'super_admin') return render();
    if (t.value === 'admin' && !isSuper(ME)) { toast('Назначать админов может только супер-админ', 'err'); return render(); }
    if (u.role === 'admin' && !isSuper(ME)) return render();
    if (u.role === 'admin' && t.value !== 'admin' && USERS.filter(x => x.role === 'admin' || x.role === 'super_admin').length < 2) { toast('Нельзя понизить последнего админа', 'err'); return render(); }
    u.role = t.value; u.updatedAt = nowIso(); saveLocal(); render(); schedulePublish();
  }
  else if (k === 'invfile') { // файл-приглашение на экране регистрации
    const f = t.files[0]; if (!f) return;
    try {
      const j = JSON.parse(await f.text()); if (j.type !== 'school-invite' || !j.email) throw 0;
      if (!S.invites.find(i => i.id === j.id)) { const { type, app, ...inv } = j; S.invites.push(inv); saveLocal(); }
      $('#a_email').value = j.email; toast('Приглашение загружено', 'ok');
    } catch (_) { toast('Это не файл-приглашение', 'err'); }
  }
  else if (k === 'import') {
    const f = t.files[0]; if (!f) return;
    try {
      const j = JSON.parse(await f.text()); if (!Array.isArray(j.students)) throw new Error('нет списка students');
      if (!(await ask(`Импортировать данные из файла (учеников: ${j.students.length})? Ученики с теми же id будут заменены.`, { ok: 'Импортировать', danger: true }))) return;
      const t0 = nowIso(); j.students.forEach(s => { fixStudent(s); s.updatedAt = t0; if (!isSuper(ME)) s.createdBy = ME.email; });
      S.students = mergeLWW(S.students, j.students, s => s.id, stStamp);
      (j.users || []).forEach(u => { if (u.role !== 'super_admin' && !USERS.find(x => normEmail(x.email) === normEmail(u.email))) USERS.push(Object.assign({}, u, { role: u.role === 'admin' && !isSuper(ME) ? 'student' : u.role, updatedAt: t0 })); });
      (j.invites || []).forEach(i => { if (!S.invites.find(x => x.id === i.id)) S.invites.push(Object.assign({}, i, { invitedBy: isSuper(ME) ? i.invitedBy : ME.email })); });
      saveLocal(); render(); schedulePublish(); toast('Импорт выполнен ✓', 'ok');
    } catch (err) { toast('Ошибка импорта: ' + err.message, 'err'); }
  }
});
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  if (t.classList.contains('lesson') && e.target.closest('button')) return;
  const f = ACT[t.dataset.act]; if (f) { e.preventDefault(); Promise.resolve(f(t, e)).catch(err => { console.error(err); toast('Ошибка: ' + (err.message || err), 'err'); }); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || ME || !e.target.matches('#app input')) return;
  const b = $('.auth .btn.primary'); if (b) b.click();
});

/* ==========================================================================
   Запуск
   ========================================================================== */
async function init() {
  applyTheme(lsRaw(LS.theme) || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  loadLocal(); ensureSuperAdmin(); saveLocal();
  const ses = lsGet(LS.session, null);
  if (ses) { const u = USERS.find(x => normEmail(x.email) === normEmail(ses.email)); if (u && !S.deletedEmails.map(normEmail).includes(normEmail(u.email))) { ME = u; curId = lsGet(LS.cur, null); } }
  render();
  if (ME) { if (isAdm(ME) || ME.role === 'student') startPolling(); }
  const ch = await loadPublishedData();
  if (ME && !USERS.find(u => u.email === ME.email)) { toast('Ваш аккаунт удалён администратором', 'err'); return logout(); }
  if (ch || !ME) render();
}
init();
</script>

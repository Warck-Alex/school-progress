<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f7cff">
<title>Учёт успеваемости</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#eef2fa; --card:#fff; --text:#151a2d; --muted:#6b7385;
  --border:#e2e7f2; --accent:#4f7cff; --accent2:#7c5cff;
  --danger:#ef4444; --radius:14px;
  --shadow:0 4px 18px rgba(24,39,75,.08);
}
body.dark{
  --bg:#151824; --card:#1e2231; --text:#e8eaf0; --muted:#8a91a8;
  --border:#2e3446; --shadow:0 4px 18px rgba(0,0,0,.4);
}
body.dark .grade{background:#252a3d}
body.dark .grade.plain{background:#252a3d}
body.dark table.grades-table td{background:#232842}
body.dark td.subject-cell{background:#1e2338!important}
body.dark .day-col{background:#1e2231}
body.dark .lesson{background:#252a3d}
body.dark .lesson-hw{background:#2a3048;color:#c4c9dc}
body.dark .panel{background:#1e2231}
body.dark .subject-card{background:#1e2231}
body.dark .chip{background:#252a3d}
body.dark input,body.dark select,body.dark textarea{background:#252a3d;color:var(--text);border-color:var(--border)}
body.dark .avg{background:#252a3d}
body.dark .invite-list li{background:#252a3d}
body.dark .pending-item{background:#252a3d}
body.dark .modal{background:#1e2231}
body.dark .auth-card{background:#1e2231}
body.dark button.secondary{background:#2e3446;color:var(--text)}
body.dark button.ghost{background:#2e3446;color:var(--accent)}
body.dark .users-table th{background:#232842}
body.dark .users-table tr:hover td{background:#232842}
body.dark .waiting-box{background:#2a2418;border-color:#5c4a1a;color:#d4b86a}
body.dark .hint-box{background:#2a2418;border-color:#5c4a1a;color:#d4b86a}
body.dark .pending-panel{background:#2a2418;border-color:#5c4a1a}
body.dark .pending-filter button{background:#252a3d;color:#d4b86a;border-color:#5c4a1a}
body.dark .pending-filter button.active{background:#f59e0b;color:#fff}
body.dark .pub-chip{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.15)}
body.dark .tooltip{background:#0a0d15}
body.dark .stats-bar{background:#2e3446}
body.dark .dev-code-box{background:#2a2418;border-color:#5c4a1a;color:#d4b86a}
body.dark .dev-code-value{color:#fff}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;padding-bottom:40px;
  transition:background .2s,color .2s}
button{font-family:inherit;font-size:14px;cursor:pointer;border:none;border-radius:10px;
  background:var(--accent);color:#fff;padding:9px 14px;transition:.15s;font-weight:600}
button:hover{filter:brightness(1.07)}
button:active{transform:scale(.97)}
button.secondary{background:#eef1f8;color:var(--text)}
button.danger{background:var(--danger)}
button.ghost{background:#eef1f8;color:var(--accent);padding:6px 10px;font-size:12.5px}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--border);
  border-radius:10px;background:var(--card);color:var(--text);width:100%;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,124,255,.13)}
textarea{resize:vertical}
label{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:10px}
label > span{display:block;margin-bottom:4px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
header.app-header{position:sticky;top:0;z-index:60;
  background:linear-gradient(135deg,#4f7cff,#7c5cff);color:#fff;
  padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  box-shadow:0 4px 20px rgba(79,124,255,.28)}
.brand{font-weight:800;font-size:16px;white-space:nowrap}
.header-spacer{flex:1}
.student-slot{flex:1 1 220px;min-width:160px;max-width:380px}
.student-slot select{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);
  color:#fff;font-weight:600;padding:7px 11px}
.student-slot select option{color:#151a2d;background:#fff}
.student-slot .student-label{
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);
  border-radius:10px;padding:7px 12px;font-weight:600;font-size:14px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gpa-chip{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);
  border-radius:999px;padding:7px 16px;font-size:15px;font-weight:700;white-space:nowrap;
  display:flex;align-items:center;gap:8px;text-shadow:0 1px 2px rgba(0,0,0,.15)}
.gpa-chip .gpa-label{font-size:15px;font-weight:700;opacity:.95}
.gpa-chip b{font-size:22px;font-weight:900;letter-spacing:.3px;padding:0 4px;line-height:1}
.pub-chip{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);
  border-radius:999px;padding:5px 11px;font-size:11.5px;white-space:nowrap;opacity:.95;cursor:default}
.user-chip{display:flex;align-items:center;gap:8px;font-size:12.5px;white-space:nowrap}
.user-chip button{background:rgba(255,255,255,.2);padding:6px 11px;font-size:12.5px;border-radius:999px}
.theme-btn{background:rgba(255,255,255,.2)!important;padding:7px 11px!important;
  font-size:15px!important;line-height:1!important;border-radius:999px!important;min-width:36px}
nav.tabs{display:flex;gap:6px;padding:10px 14px 0;max-width:1400px;margin:0 auto;flex-wrap:wrap}
nav.tabs button{background:transparent;color:var(--muted);padding:9px 16px;
  border-radius:10px 10px 0 0;font-weight:700;font-size:14px}
nav.tabs button.active{background:var(--card);color:var(--accent);box-shadow:var(--shadow)}
nav.tabs button .badge-pending{display:inline-block;background:#ef4444;color:#fff;
  border-radius:999px;padding:0 6px;font-size:11px;font-weight:800;margin-left:6px;
  vertical-align:middle;min-width:18px;text-align:center;line-height:18px;height:18px}
main{max-width:1400px;margin:0 auto;padding:0 14px}
.tab-panel{display:none;background:var(--card);border-radius:0 var(--radius) var(--radius) var(--radius);
  padding:16px;box-shadow:var(--shadow)}
.tab-panel.active{display:block}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-bottom:12px;flex-wrap:wrap}
.section-head h2{margin:0;font-size:17px}
.grades-table-wrap{overflow-x:auto}
table.grades-table{border-collapse:separate;border-spacing:6px;width:100%;min-width:520px}
table.grades-table th{font-size:12px;color:var(--muted);font-weight:700;padding:4px 6px;
  text-align:center;white-space:nowrap}
table.grades-table th.th-subject{text-align:left;min-width:190px}
table.grades-table td{background:#f7f9fe;border-radius:10px;padding:6px;text-align:center;vertical-align:middle}
td.subject-cell{text-align:left!important;background:#eef2fd!important;padding:8px 10px!important;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:60px}
.subject-name{font-weight:700}
.avg{background:#fff;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:800;
  color:var(--accent);border:1px solid var(--border)}
.del-subject{background:transparent;color:var(--danger);font-size:17px;padding:0 6px;
  font-weight:800;line-height:1}
.grade{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:#fff;border:1px solid var(--border);border-radius:10px;padding:4px 7px 3px;cursor:pointer;
  user-select:none;-webkit-user-select:none;transition:.12s;min-width:44px;min-height:48px}
.grade:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(79,124,255,.18);border-color:var(--accent)}
.grade-value{font-weight:900;font-size:16px;line-height:1;letter-spacing:.2px}
.badge{font-size:9.5px;font-weight:800;padding:1px 5px;border-radius:5px;color:#fff;
  letter-spacing:.2px;white-space:nowrap}
.t0{background:#ef4444}.t1{background:#f97316}.t2{background:#f59e0b}.t3{background:#10b981}
.t4{background:#06b6d4}.t5{background:#7c5cff}.t6{background:#ec4899}.t7{background:#64748b}
.grade.plain{padding:0;width:48px;height:48px;min-width:48px;min-height:48px;justify-content:center;background:#fff}
.grade.plain .grade-value{font-size:22px}
.add-grade{background:#e7ecfb;color:var(--accent);font-weight:800;font-size:17px;line-height:1;
  width:30px;height:30px;padding:0;border-radius:9px}
.grades-cards{display:none}
.subject-card{background:#f7f9fe;border-radius:12px;padding:11px;margin-bottom:10px}
.subject-card-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.grades-wrap{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.empty{text-align:center;color:var(--muted);padding:36px 14px;font-size:14px}
.waiting-box{background:#fff8e6;border:2px dashed #f59e0b;border-radius:14px;
  padding:30px 18px;color:#7a5b00}
.schedule-grid{display:grid;grid-template-columns:repeat(6,minmax(150px,1fr));gap:10px;overflow-x:auto}
.day-col{background:#f7f9fe;border-radius:12px;padding:10px;min-width:150px;transition:.15s}
.day-col.drag-over{background:#e3ecff;box-shadow:inset 0 0 0 2px var(--accent)}
.day-col h3{margin:0 0 9px;font-size:13.5px;text-align:center;color:var(--accent);
  font-weight:800;text-transform:uppercase;letter-spacing:.3px}
.lessons{display:flex;flex-direction:column;gap:8px;min-height:20px}
.lesson{background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px 9px;
  cursor:pointer;transition:.12s;position:relative}
.lesson:hover{border-color:var(--accent);box-shadow:0 4px 12px rgba(79,124,255,.14)}
.lesson.dragging{opacity:.4;transform:scale(.98)}
.lesson.drag-target{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.lesson-drag{position:absolute;top:6px;right:6px;color:var(--muted);font-size:12px;
  cursor:grab;user-select:none;line-height:1;padding:2px 4px;border-radius:4px}
.lesson-drag:hover{background:#e7ecfb;color:var(--accent)}
.lesson-subject{font-weight:800;font-size:13.5px;padding-right:20px}
.lesson-meta{font-size:11.5px;color:var(--muted);margin-top:2px}
.lesson-hw{font-size:12px;margin-top:6px;background:#f4f7ff;border-radius:7px;padding:5px 7px;
  white-space:pre-wrap;word-break:break-word;color:#38405a}
.add-lesson{width:100%;background:#e7ecfb;color:var(--accent);font-size:12.5px;padding:7px;margin-top:8px}
.cabinet-grid{display:grid;grid-template-columns:minmax(260px,1fr) 1.6fr;gap:12px;align-items:start}
.cabinet-col{display:flex;flex-direction:column;gap:0}
.panel{background:#f7f9fe;border-radius:12px;padding:14px;margin-bottom:12px}
.panel h3{margin:0 0 10px;font-size:14.5px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:2px 0;line-height:1.25;font-size:13.5px}
.kv + .kv{margin-top:1px}
.kv span{color:var(--muted)}
.kv b{font-weight:700}
.role-badge{padding:2px 10px;border-radius:999px;font-size:12px;color:#fff}
.role-admin{background:#7c5cff}.role-student{background:#10b981}.role-viewer{background:#64748b}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.chip{background:#fff;border:1px solid var(--border);border-radius:999px;padding:4px 6px 4px 12px;
  font-size:13px;display:inline-flex;align-items:center;gap:5px}
.chip-x{background:transparent;color:var(--danger);font-size:15px;padding:0 4px;line-height:1;font-weight:800}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row input,.row select{flex:1 1 160px;width:auto}
.invite-list{list-style:none;margin:10px 0 0;padding:0}
.invite-list li{display:flex;justify-content:space-between;align-items:center;gap:8px;
  background:#fff;border:1px solid var(--border);border-radius:9px;padding:7px 11px;
  margin-bottom:6px;font-size:13.5px;flex-wrap:wrap}
.invite-list li .invite-info{flex:1 1 160px;min-width:0}
.invite-list li .invite-actions{display:flex;gap:6px;flex-wrap:wrap}
button.wide{width:100%;margin-top:10px}
.hint-box{background:#fff8e6;border:1px solid #ffe1a8;border-radius:10px;padding:9px 11px;
  font-size:12.5px;color:#7a5b00;margin:8px 0 0;line-height:1.4}
.pending-panel{background:#fff8e6;border:2px solid #f59e0b;border-radius:12px;
  padding:14px;margin-bottom:12px}
.pending-panel h3{margin:0 0 10px;font-size:14.5px;color:#7a5b00}
.pending-filter{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.pending-filter button{background:#fff;color:#7a5b00;padding:5px 11px;font-size:12px;
  border:1px solid #ffe1a8}
.pending-filter button.active{background:#f59e0b;color:#fff;border-color:#f59e0b}
.pending-item{background:#fff;border:1px solid #ffe1a8;border-radius:9px;padding:9px 11px;
  margin-bottom:7px;font-size:13px;line-height:1.4}
.pending-item .pending-head{font-weight:700;margin-bottom:3px}
.pending-item .pending-meta{color:#7a5b00;font-size:12px;margin-bottom:4px}
.pending-item .pending-grade{margin:5px 0}
.pending-item .pending-actions{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.stats-list{display:flex;flex-direction:column;gap:7px}
.stats-row{display:flex;align-items:center;gap:9px;font-size:13px}
.stats-name{flex:0 0 130px;font-weight:600;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;color:var(--text)}
.stats-bar{flex:1;height:20px;background:#e7ecfb;border-radius:6px;position:relative;overflow:hidden}
.stats-fill{height:100%;border-radius:6px;transition:.3s;
  display:flex;align-items:center;justify-content:flex-end;padding-right:6px;
  color:#fff;font-size:11px;font-weight:800;min-width:28px;text-shadow:0 1px 1px rgba(0,0,0,.3)}
.stats-val{flex:0 0 40px;font-weight:800;font-size:13px;text-align:right;color:var(--text)}
.users-table-wrap{overflow-x:auto}
.users-table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
.users-table th{text-align:left;padding:9px 11px;background:#eef2fd;color:var(--muted);
  font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;
  border-bottom:1px solid var(--border)}
.users-table th:first-child{border-radius:8px 0 0 0}
.users-table th:last-child{border-radius:0 8px 0 0}
.users-table td{padding:9px 11px;border-bottom:1px solid var(--border);vertical-align:middle}
.users-table tr:last-child td{border-bottom:none}
.users-table tr:hover td{background:#f7f9fe}
.users-table select{font-size:12.5px;padding:4px 8px;width:auto;min-width:130px}
.auth-screen{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#4f7cff,#7c5cff);padding:18px;overflow-y:auto}
.auth-screen.show{display:flex}
.auth-card{background:#fff;border-radius:18px;padding:26px 22px;width:100%;max-width:400px;
  box-shadow:0 20px 50px rgba(20,30,70,.3);margin:auto}
body.dark .auth-card{background:#1e2231;color:var(--text)}
.auth-card h1{margin:0 0 4px;font-size:20px;text-align:center}
.auth-card p{margin:0 0 18px;text-align:center;font-size:13px}
.auth-card input{margin-bottom:10px}
.auth-card button{width:100%;margin-bottom:8px;padding:11px}
.error{color:var(--danger);font-size:12.5px;min-height:16px;text-align:center;margin-top:6px}
.invite-banner{background:#e7f6ec;border:1px solid #b6e2c4;color:#0f6a33;border-radius:10px;
  padding:10px 12px;font-size:13px;margin-bottom:12px;text-align:center;line-height:1.4}
.auth-hint{font-size:12px;color:var(--muted);text-align:center;margin-top:6px;line-height:1.35}
.auth-forgot{text-align:center;margin-top:10px}
.auth-forgot a{color:var(--accent);font-size:13px;text-decoration:none;cursor:pointer}
.auth-forgot a:hover{text-decoration:underline}
.code-input{font-size:24px;letter-spacing:8px;text-align:center;font-weight:800;
  padding:14px;font-family:monospace}
.dev-code-box{background:#fff8e6;border:1px dashed #f59e0b;border-radius:10px;
  padding:12px;margin:0 0 12px;text-align:center;color:#7a5b00}
.dev-code-value{font-size:34px;font-weight:900;letter-spacing:10px;
  font-family:monospace;color:#151a2d;line-height:1;margin-top:8px}
#modal-root{display:none}
#modal-root.open{display:block}
.modal-overlay{position:fixed;inset:0;z-index:300;background:rgba(15,20,40,.5);
  display:flex;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(3px)}
.modal{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:440px;
  max-height:92vh;overflow-y:auto;box-shadow:0 20px 50px rgba(20,30,70,.35)}
.modal h2{margin:0 0 14px;font-size:17px}
.modal-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.modal-actions button{flex:1 1 auto;min-width:90px}
.modal-actions .danger{flex:0 1 auto}
.tooltip{position:fixed;z-index:9999;pointer-events:none;opacity:0;transition:opacity .15s;
  background:#1b2138;color:#fff;border-radius:10px;padding:9px 12px;font-size:12.5px;
  max-width:270px;box-shadow:0 10px 30px rgba(10,15,40,.35);line-height:1.4}
.tooltip.show{opacity:1}
.tooltip .tip-row{margin-bottom:3px}
.tooltip .tip-comment{margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.18);
  white-space:pre-wrap;word-break:break-word;color:#d7ddf1}
@media print{
  header.app-header,nav.tabs,.tab-panel:not(#tab-grades),
  .grades-cards,#grades-actions,.user-chip,.pub-chip,.theme-btn{display:none!important}
  body{background:#fff!important;color:#000!important;padding:0}
  .tab-panel{box-shadow:none;border-radius:0;padding:0}
}
@media (max-width: 820px){
  .grades-table-wrap{display:none}
  .grades-cards{display:block}
  header.app-header{padding:9px 11px;gap:7px}
  .brand{font-size:14.5px}
  .student-slot{flex:1 1 100%;max-width:none;order:3}
  .gpa-chip{font-size:13px;padding:6px 12px}
  .gpa-chip b{font-size:19px}
  .gpa-chip .gpa-label{font-size:13px}
  .user-chip{font-size:11.5px}
  .pub-chip{font-size:10.5px;padding:4px 9px;order:10;flex:1 1 100%;text-align:center}
  main{padding:0 9px}
  nav.tabs{padding:8px 9px 0}
  nav.tabs button{padding:8px 11px;font-size:13px}
  .tab-panel{padding:12px}
  .cabinet-grid{grid-template-columns:1fr}
  .users-table{font-size:12px;min-width:520px}
  .users-table th, .users-table td{padding:7px 8px}
  .stats-name{flex:0 0 90px;font-size:12px}
}
</style>
</head>
<body>

<div class="auth-screen show" id="auth-screen">
  <div class="auth-card">
    <h1>📚 Учёт успеваемости</h1>
    <p class="muted" id="auth-subtitle">Войдите или создайте аккаунт</p>
    <div id="invite-banner-slot"></div>
    <input id="auth-email" type="email" placeholder="Email" autocomplete="email">
    <input id="auth-password" type="password" placeholder="Пароль (мин. 6 символов)" autocomplete="current-password">
    <input id="auth-student-name" placeholder="ФИО учащегося (для регистрации)" maxlength="120">
    <button id="btn-login">Войти</button>
    <button id="btn-register" class="secondary">Зарегистрироваться</button>
    <div class="auth-forgot"><a id="forgot-link">Забыли пароль?</a></div>
    <div class="auth-hint">
      При регистрации укажите ФИО учащегося. При входе ФИО не требуется.
    </div>
    <div class="error" id="auth-error"></div>
  </div>
</div>

<header class="app-header" id="app-header" style="display:none">
  <div class="brand">📚 Успеваемость</div>
  <div class="student-slot" id="student-slot"></div>
  <div class="gpa-chip">
    <span class="gpa-label">Средний балл:</span>
    <b id="gpaValue">—</b>
  </div>
  <div class="pub-chip" id="pubChip" title="">—</div>
  <div class="header-spacer"></div>
  <button class="theme-btn" id="theme-btn" title="Тема">🌙</button>
  <div class="user-chip">
    <span id="userInfo"></span>
    <button id="btn-logout">Выйти</button>
  </div>
</header>

<nav class="tabs" id="tabs" style="display:none">
  <button data-tab="grades" class="active">Оценки</button>

function defaultStudent(name){
  return { id: uid(), studentName: name || '', subjects: [], schedule: [],
    catalog: DEFAULT_CATALOG.slice(), members: [], createdAt: new Date().toISOString() };
}
function defaultData(){ return { students: [], users: [], deletedEmails: [], publishedAt: null }; }
function normalizeStudent(s){
  return {
    id: s.id || uid(),
    studentName: typeof s.studentName === 'string' ? s.studentName : '',
    subjects: Array.isArray(s.subjects) ? s.subjects : [],
    schedule: Array.isArray(s.schedule) ? s.schedule : [],
    catalog: Array.isArray(s.catalog) ? s.catalog : [],
    members: Array.isArray(s.members) ? s.members : [],
    createdAt: s.createdAt || new Date().toISOString()
  };
}
function normalizeData(d){
  if(!d || typeof d !== 'object') return defaultData();
  let arr = [];
  if(Array.isArray(d.students)) arr = d.students.map(normalizeStudent);
  else if(d.subjects || d.studentName) arr = [normalizeStudent(d)];
  return {
    students: arr,
    users: Array.isArray(d.users) ? d.users : [],
    deletedEmails: Array.isArray(d.deletedEmails) ? d.deletedEmails : [],
    publishedAt: d.publishedAt || null
  };
}
const getCurrentStudent = () => data ? data.students.find(s => s.id === currentStudentId) : null;
function subjectAvg(s){
  const v = (s.grades || []).map(g => Number(g.value)).filter(n => !isNaN(n));
  return v.length ? v.reduce((a,b)=>a+b,0) / v.length : null;
}
function overallGpa(){
  const st = getCurrentStudent();
  if(!st) return null;
  let sum = 0, n = 0;
  (st.subjects || []).forEach(s => (s.grades || []).forEach(g => {
    const v = Number(g.value);
    if(!isNaN(v)){ sum += v; n++; }
  }));
  return n ? sum / n : null;
}

function randomSalt(){
  const arr = new Uint8Array(16);
  (window.crypto || {}).getRandomValues
    ? crypto.getRandomValues(arr)
    : arr.forEach((_,i) => arr[i] = Math.floor(Math.random()*256));
  return Array.from(arr).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function hashPassword(password, salt){
  const d = new TextEncoder().encode(salt + '::' + password);
  if(window.crypto && window.crypto.subtle){
    const buf = await crypto.subtle.digest('SHA-256', d);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }
  let h = 0;
  for(let i = 0; i < d.length; i++) h = ((h << 5) - h + d[i]) | 0;
  return 'fb_' + Math.abs(h).toString(16);
}

/* ============================================================================
   GITHUB API
   ============================================================================ */
function decodeBase64(str){
  str = String(str || '').replace(/\s+/g, '');
  try{ return decodeURIComponent(escape(atob(str))); }
  catch{ try{ return atob(str); }catch{ return ''; } }
}

async function loadPublishedData(){
  try{
    const res = await fetch(DATA_URL + '?_=' + Date.now(), { cache: 'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return normalizeData(await res.json());
  }catch(e){ console.warn('data.json недоступен:', e); return null; }
}

/* Токен публикации — запрашиваем один раз на устройстве */
async function ensurePublishToken(){
  let token = localStorage.getItem('gh_token');
  if(token) return token;
  token = prompt(
    'Введите GitHub токен для публикации данных.\n\n' +
    '• Если вы администратор — создайте на github.com/settings/tokens?type=beta\n' +
    '  Права: Contents → Read and write для репозитория school-progress\n\n' +
    '• Если вы ученик — попросите токен у администратора.\n' +
    'Токен сохранится только на этом устройстве.'
  );
  if(!token) return null;
  token = token.trim();
  localStorage.setItem('gh_token', token);
  return token;
}

/* Тихая публикация — без confirm, для автосинхронизации */
async function publishToGitHubSilent(){
  if(!canPublish()) return false;
  const token = localStorage.getItem('gh_token');
  if(!token) return false;
  const apiUrl = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}`;
  const headers = { 'Authorization': 'Bearer ' + token,
    'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' };
  try{
    const getRes = await fetch(apiUrl, { headers });
    let sha = null;
    if(getRes.ok){ sha = (await getRes.json()).sha; }
    else if(getRes.status !== 404) return false;
    const toPublish = Object.assign({}, data, { publishedAt: new Date().toISOString() });
    const content = JSON.stringify(toPublish, null, 2);
    const body = { message: 'Auto-publish ' + new Date().toLocaleString('ru-RU'),
      content: btoa(unescape(encodeURIComponent(content))) };
    if(sha) body.sha = sha;
    const putRes = await fetch(apiUrl, { method: 'PUT', headers, body: JSON.stringify(body) });
    if(!putRes.ok) return false;
    data.publishedAt = toPublish.publishedAt;
    DataStore.save(data);
    renderAll();
    return true;
  }catch(e){ console.warn('Auto-publish:', e); return false; }
}

async function publishToGitHub(){
  if(!canPublish()) return;
  const token = await ensurePublishToken();
  if(!token) return;
  if(!confirm('Опубликовать данные всех учеников и пользователей?')) return;
  const apiUrl = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}`;
  const headers = { 'Authorization': 'Bearer ' + token,
    'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' };
  try{
    const getRes = await fetch(apiUrl, { headers });
    let sha = null;
    if(getRes.ok){ sha = (await getRes.json()).sha; }
    else if(getRes.status === 404){ sha = null; }
    else{ const err = await getRes.json().catch(()=>({})); throw new Error(err.message || ('HTTP ' + getRes.status)); }
    const toPublish = Object.assign({}, data, { publishedAt: new Date().toISOString() });
    const content = JSON.stringify(toPublish, null, 2);
    const body = { message: 'Publish data ' + new Date().toLocaleString('ru-RU'),
      content: btoa(unescape(encodeURIComponent(content))) };
    if(sha) body.sha = sha;
    const putRes = await fetch(apiUrl, { method: 'PUT', headers, body: JSON.stringify(body) });
    if(!putRes.ok){ const err = await putRes.json().catch(()=>({})); throw new Error(err.message || ('HTTP ' + putRes.status)); }
    data.publishedAt = toPublish.publishedAt;
    DataStore.save(data);
    renderAll();
    alert('✅ Данные опубликованы!\nЧерез 1–2 минуты появятся у всех.');
  }catch(e){
    const msg = String(e.message || e);
    if(msg.includes('401') || msg.includes('Bad credentials')){
      localStorage.removeItem('gh_token');
      alert('❌ Токен недействителен. Удалён.');
    }else if(msg.includes('403')){
      alert('❌ У токена нет прав на запись.');
    }else{ alert('❌ Ошибка: ' + msg); }
  }
}

async function syncFromGitHub(){
  if(!canPublish()) return;
  try{
    const published = await loadPublishedData();
    if(!published){ alert('Не удалось получить data.json с GitHub.'); return; }
    const deleted = new Set(published.deletedEmails || []);
    const oldUsers = (data.users || []).length;
    // Мержим: удалённые из blacklist исключаются, остальные объединяются
    const byEmail = {};
    (published.users || []).forEach(u => { if(u && u.email && !deleted.has(u.email)) byEmail[u.email] = u; });
    (data.users || []).forEach(u => { if(u && u.email && !deleted.has(u.email)) byEmail[u.email] = u; });
    published.users = Object.values(byEmail);
    // Локальные deletedEmails тоже сохраняем
    const localDeleted = new Set(data.deletedEmails || []);
    published.deletedEmails = Array.from(new Set([...deleted, ...localDeleted]));
    data = published;
    DataStore.save(data);
    Users.save(data.users);
    renderAll();
    alert('🔄 Данные обновлены с GitHub.\nПользователей: ' + oldUsers + ' → ' + (data.users || []).length);
  }catch(e){ alert('Ошибка синхронизации: ' + e.message); }
}

/* ============================================================================
   PENDING
   ============================================================================ */
async function fetchPending(){
  const url = `https://api.github.com/repos/${GH_PENDING.owner}/${GH_PENDING.repo}/contents/${GH_PENDING.file}`;
  const res = await fetch(url, { headers: {
    'Authorization': 'Bearer ' + GH_PENDING.token,
    'Accept': 'application/vnd.github+json' }, cache: 'no-store' });
  if(res.status === 404) return { list: [], sha: null };
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const info = await res.json();
  const content = decodeBase64(info.content);
  let list = []; try{ list = JSON.parse(content || '[]'); }catch(e){ list = []; }
  return { list, sha: info.sha };
}
async function pushPending(list, sha){
  const url = `https://api.github.com/repos/${GH_PENDING.owner}/${GH_PENDING.repo}/contents/${GH_PENDING.file}`;
  const body = { message: 'Pending update ' + new Date().toLocaleString('ru-RU'),
    content: btoa(unescape(encodeURIComponent(JSON.stringify(list, null, 2)))) };
  if(sha) body.sha = sha;
  const res = await fetch(url, { method: 'PUT', headers: {
    'Authorization': 'Bearer ' + GH_PENDING.token,
    'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
    body: JSON.stringify(body) });
  if(!res.ok){ const err = await res.json().catch(()=>({})); throw new Error(err.message || 'HTTP ' + res.status); }
}
async function submitChangeToPending(change){
  const { list, sha } = await fetchPending();
  const idx = list.findIndex(x => x.status === 'pending' &&
    x.studentId === change.studentId && x.gradeId === change.gradeId && x.type === change.type);
  if(idx >= 0) list[idx] = change; else list.push(change);
  await pushPending(list, sha);
}
async function refreshPending(){
  if(!isAdmin()) return;
  try{
    const { list } = await fetchPending();
    pendingChanges = list.filter(x => x.status === 'pending');
    // Ищем новые (которых не было в прошлый раз)
    const newOnes = pendingChanges.filter(c => !lastSeenPendingIds.has(c.id));
    if(newOnes.length && lastSeenPendingIds.size > 0){
      newOnes.forEach(c => {
        const who = c.studentName || c.studentEmail || 'кто-то';
        const what =
          c.type === 'new_student'   ? '🆕 Зарегистрировался новый ученик' :
          c.type === 'new_user'      ? '👤 Новый пользователь' :
          c.type === 'password_reset'? '🔑 Сброс пароля' :
          c.action === 'add'         ? '➕ Новая оценка' :
          c.action === 'update'      ? '✏️ Изменение оценки' :
          c.action === 'delete'      ? '🗑️ Удаление оценки' : '📝 Изменение';
        notifyAdmin('Новая заявка', `${what}\nот ${who}`);
      });
    }
    lastSeenPendingIds = new Set(pendingChanges.map(c => c.id));
    updatePendingBadge();
    if($('tab-cabinet').classList.contains('active')) renderCabinet();
  }catch(e){
    console.warn('Pending недоступен:', e);
    pendingChanges = []; updatePendingBadge();
  }
}
function requestNotifyPermission(){
  if(!('Notification' in window)) return;
  if(Notification.permission === 'default'){
    Notification.requestPermission().catch(()=>{});
  }
}

function notifyAdmin(title, body){
  // 1. Браузерное уведомление
  try{
    if('Notification' in window && Notification.permission === 'granted'){
      new Notification(title, { body: body });
    }
  }catch(e){ console.warn('Browser notify:', e); }

  // 2. Telegram (если настроен)
  if(NOTIFY.telegramBot && NOTIFY.telegramChat){
    fetch(`https://api.telegram.org/bot${NOTIFY.telegramBot}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        chat_id: NOTIFY.telegramChat,
        text: title + '\n\n' + body
      })
    }).catch(e => console.warn('Telegram:', e));
  }

  // 3. Звуковой сигнал
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 800;
    gain.gain.value = 0.1;
    osc.start();
    osc.stop(ctx.currentTime + 0.15);
  }catch(e){}
}

function startPendingPolling(){
  if(notifyTimer) clearInterval(notifyTimer);
  if(!isAdmin()) return;
  requestNotifyPermission();
  refreshPending();
  notifyTimer = setInterval(() => {
    if(!isAdmin()){ stopPendingPolling(); return; }
    refreshPending();
  }, NOTIFY.pollInterval);
}

function stopPendingPolling(){
  if(notifyTimer){ clearInterval(notifyTimer); notifyTimer = null; }
}
function updatePendingBadge(){
  const btn = document.querySelector('nav.tabs button[data-tab="cabinet"]');
  if(!btn) return;
  const ex = btn.querySelector('.badge-pending'); if(ex) ex.remove();
  if(isAdmin() && pendingChanges.length > 0){
    const s = document.createElement('span');
    s.className = 'badge-pending'; s.textContent = pendingChanges.length;
    btn.appendChild(s);
  }
}
async function removePendingItem(changeId){
  const { list, sha } = await fetchPending();
  const filtered = list.filter(x => x.id !== changeId);
  await pushPending(filtered, sha);
  pendingChanges = filtered.filter(x => x.status === 'pending');
  updatePendingBadge();
}
async function approveChange(changeId){
  const change = pendingChanges.find(c => c.id === changeId);
  if(!change) return;
  try{
    if(change.type === 'new_student'){
      const exists = data.students.find(s => s.id === change.studentId ||
        s.studentName.toLowerCase() === (change.studentName || '').toLowerCase());
      if(exists){
        const u = Users.findEmail(change.studentEmail);
        if(u) Users.update(u.uid, { studentId: exists.id });
        alert('Ученик с таким ФИО уже есть — пользователь привязан к нему.');
      }else{
        data.students.push(normalizeStudent({
          id: change.studentId, studentName: change.studentName,
          subjects: [], schedule: [], catalog: DEFAULT_CATALOG.slice(), members: []
        }));
      }
      if(change.user && change.user.email){
        data.users = data.users || [];
        if(!data.users.find(u => u.email === change.user.email)) data.users.push(change.user);
      }
    }else if(change.type === 'new_user'){
      if(change.user && change.user.email){
        data.users = data.users || [];
        if(!data.users.find(u => u.email === change.user.email)) data.users.push(change.user);
      }
    }else if(change.type === 'password_reset'){
      data.users = data.users || [];
      const idx = data.users.findIndex(u => u.email === change.userEmail);
      if(idx >= 0){
        data.users[idx].passwordHash = change.newPasswordHash;
        data.users[idx].salt = change.newSalt;
      }else{
        alert('Пользователь не найден.');
        await removePendingItem(changeId);
        return;
      }
    }else{
      const st = data.students.find(s => s.id === change.studentId);
      if(!st){ alert('Ученик не найден'); return; }
      let subj = (st.subjects || []).find(s => s.id === change.subjectId);
      if(!subj){
        if(!confirm('Предмет «' + change.subjectName + '» не найден. Создать?')) return;
        subj = { id: change.subjectId, name: change.subjectName, grades: [] };
        st.subjects = st.subjects || []; st.subjects.push(subj);
      }
      subj.grades = subj.grades || [];
      if(change.action === 'add'){
        if(!subj.grades.find(g => g.id === change.gradeId))
          subj.grades.push(Object.assign({ id: change.gradeId || uid() }, change.grade));
      }else if(change.action === 'update'){
        const g = subj.grades.find(x => x.id === change.gradeId);
        if(g) Object.assign(g, change.grade);
        else subj.grades.push(Object.assign({ id: change.gradeId || uid() }, change.grade));
      }else if(change.action === 'delete'){
        subj.grades = subj.grades.filter(x => x.id !== change.gradeId);
      }
    }
    DataStore.save(data);
    if(data.users) Users.save(data.users);
    await removePendingItem(changeId);
    renderAll();
    const pubOk = await publishToGitHubSilent();
    if(pubOk){
      alert('✅ Принято и сразу опубликовано.\n\nЧерез 1–2 минуты изменения увидят все.');
    }else{
      alert('✅ Принято локально.\n\nНажмите «📤 Опубликовать данные» — нет сохранённого токена или GitHub недоступен.');
    }
  }catch(e){ alert('Ошибка: ' + e.message); }
}
async function rejectChange(changeId){
  const reason = prompt('Причина отклонения (необязательно):');
  if(reason === null) return;
  try{
    await removePendingItem(changeId);
    renderCabinet();
    if(reason.trim()) alert('Заявка отклонена. Причина: ' + reason.trim());
  }catch(e){ alert('Не удалось отклонить: ' + e.message); }
}

function generateCode(){
  return String(Math.floor(100 + Math.random() * 900));
}
function saveVerification(email, code, purpose){
  DB.write('verify_' + purpose, {
    email, code,
    expiresAt: Date.now() + 10 * 60 * 1000,
    attempts: 0
  });
}
function getVerification(purpose){
  const v = DB.read('verify_' + purpose, null);
  if(!v) return null;
  if(Date.now() > v.expiresAt){ DB.write('verify_' + purpose, null); return null; }
  return v;
}
function clearVerification(purpose){
  DB.write('verify_' + purpose, null);
}

async function register(email, password, studentName){
  email = String(email).trim().toLowerCase();
  if(!email || email.indexOf('@') < 0) throw new Error('Некорректный email');
  if(!password || password.length < 6) throw new Error('Пароль минимум 6 символов');
  studentName = String(studentName || '').trim();
  if(!studentName) throw new Error('Введите ФИО учащегося');

  const invite = window.__APP_INVITE;
  let role;
  if(email === String(ADMIN_EMAIL).toLowerCase()) role = 'admin';
  else if(invite && invite.email === email) role = invite.role || 'viewer';
  else{
    const localInv = Invites.findByEmail(email);
    role = localInv ? (localInv.role || 'viewer') : 'viewer';
  }

  let student = data.students.find(s => s.studentName.toLowerCase() === studentName.toLowerCase());
  let isNewStudent = false;
  if(!student){
    student = defaultStudent(studentName);
    data.students.push(student);
    isNewStudent = true;
  }
  const salt = randomSalt();
  const passwordHash = await hashPassword(password, salt);
  const user = { uid: uid(), email, name: studentName, role,
    studentId: student.id, salt, passwordHash, createdAt: new Date().toISOString() };

  // Убираем старую запись с тем же email и из blacklist
  Users.save(Users.all().filter(u => u.email !== email).concat([user]));
  data.users = (data.users || []).filter(u => u.email !== email).concat([user]);
  data.deletedEmails = (data.deletedEmails || []).filter(e => e !== email);
  DataStore.save(data);

  const localInv = Invites.findByEmail(email);
  if(localInv) Invites.remove(localInv.id);
  if(invite && invite.email === email){ try{ delete window.__APP_INVITE; }catch(e){} }
  Session.set(user.uid);
  currentStudentId = student.id;

  // Отправляем заявку админу (для истории)
  try{
    await submitChangeToPending({
      id: uid(), timestamp: new Date().toISOString(),
      type: isNewStudent ? 'new_student' : 'new_user',
      status: 'pending',
      studentEmail: email, studentName: studentName, studentId: student.id,
      user: user
    });
  }catch(e){ console.warn('Заявка не отправлена:', e); }

  // Автопубликация — только для админа
  if(isAdmin() && localStorage.getItem('gh_token')){
    setTimeout(() => publishToGitHubSilent(), 100);
  }

  return { user, isNewStudent };
}

async function login(email, password){
  email = String(email).trim().toLowerCase();
  let user = Users.findEmail(email);
  if(!user && Array.isArray(data.users)){
    user = data.users.find(u => u.email === email);
    if(user) Users.add(user);
  }
  if(!user) throw new Error('Пользователь не найден. Пройдите регистрацию.');
  const hash = await hashPassword(password, user.salt);
  if(hash !== user.passwordHash) throw new Error('Неверный пароль');
  if(email === String(ADMIN_EMAIL).toLowerCase() && user.role !== 'admin'){
    Users.update(user.uid, { role: 'admin' });
    if(data.users){
      const du = data.users.find(x => x.email === email);
      if(du) du.role = 'admin';
    }
    DataStore.save(data);
    user.role = 'admin';
  }
  let student = data.students.find(s => s.id === user.studentId);
  if(!student){
    student = data.students.find(s => s.studentName.toLowerCase() === (user.name || '').toLowerCase());
    if(student) Users.update(user.uid, { studentId: student.id });
    else{
      student = defaultStudent(user.name || email.split('@')[0]);
      data.students.push(student); DataStore.save(data);
      Users.update(user.uid, { studentId: student.id });
    }
  }
  Session.set(user.uid);
  return { user, studentId: student.id };
}

        : `Мы отправили 3-значный код на <b>${esc(email)}</b>.<br>Введите его ниже. Код действует 10 минут.`}

    input.value = input.value.replace(/\D/g, '').slice(0,3);

  });
  input.addEventListener('keydown', e => { if(e.key === 'Enter') $('code-submit').click(); });

  $('code-submit').addEventListener('click', async () => {

      }
    });

}

async function bootSession(){
  applyTheme();
  const published = await loadPublishedData();
  if(published){
    const deleted = new Set(published.deletedEmails || []);
    const localUsers = Users.all();
    const remoteUsers = published.users || [];
    // Мержим, исключая blacklist
    const byEmail = {};
    remoteUsers.forEach(u => { if(u && u.email && !deleted.has(u.email)) byEmail[u.email] = u; });
    localUsers.forEach(u => { if(u && u.email && !deleted.has(u.email)) byEmail[u.email] = u; });
    published.users = Object.values(byEmail);
    const localDeleted = new Set(data ? (data.deletedEmails || []) : []);
    published.deletedEmails = Array.from(new Set([...deleted, ...localDeleted]));
    data = published;
    DataStore.save(data);
    Users.save(published.users);
  }else{
    data = DataStore.get();
  }
  applyEmbeddedInvite();
  const sid = Session.get();
  if(!sid){ showAuth(); return; }
  const user = Users.findId(sid);
  if(!user){ Session.clear(); showAuth(); return; }
  const deleted = new Set(data.deletedEmails || []);
  if(deleted.has(user.email)){
    Session.clear(); showAuth();
    $('auth-error').textContent = 'Ваш аккаунт удалён администратором.';
    return;
  }
  currentUser = user;
  currentStudentId = user.studentId;
  let st = data.students.find(s => s.id === currentStudentId);
  if(!st){
    st = data.students.find(s => s.studentName.toLowerCase() === (user.name || '').toLowerCase());
    if(st){ currentStudentId = st.id; Users.update(user.uid, { studentId: st.id }); }
    else{
      st = defaultStudent(user.name || user.email.split('@')[0]);
      data.students.push(st); DataStore.save(data);
      currentStudentId = st.id;
      Users.update(user.uid, { studentId: st.id });
    }
  }
  invites = Invites.all();
  showApp(); renderAll();
  if(isAdmin()) startPendingPolling();
}

      html = `<div class="empty">Предметов пока нет.<br><br>Добавьте предметы в каталог.</div>`;
    } else {
      html = `<div class="empty">Предметов пока нет.</div>`;
    }
    $('grades-table').innerHTML = html;
    $('grades-cards').innerHTML = html;
    return;
  }
  const maxG = subjects.reduce((m,s) => Math.max(m, (s.grades || []).length), 0);
  let thead = '<tr><th class="th-subject">Предмет</th>';
  for(let i = 0; i < maxG; i++) thead += `<th>${i + 1}</th>`;
  if(canAdd) thead += '<th></th>';
  thead += '</tr>';
  const rows = subjects.map(s => {
    const avg = subjectAvg(s);
    let tds = '';
    for(let i = 0; i < maxG; i++){
      const g = (s.grades || [])[i];
      tds += `<td class="grade-td">${g ? gradeCellHtml(s, g) : ''}</td>`;
    }
    if(canAdd) tds += `<td class="grade-td"><button class="add-grade" data-add-grade="${esc(s.id)}" title="Добавить">+</button></td>`;
    return `<tr>
      <td class="subject-cell">
        <span class="subject-name">${esc(s.name)}</span>
        <span class="avg">${avg === null ? '—' : avg.toFixed(2)}</span>
        ${isAdmin() ? `<button class="del-subject" data-del-subject="${esc(s.id)}">×</button>` : ''}
      </td>
      ${tds}
    </tr>`;
  }).join('');
  $('grades-table').innerHTML = `<table class="grades-table"><thead>${thead}</thead><tbody>${rows}</tbody></table>`;
  $('grades-cards').innerHTML = subjects.map(s => {
    const avg = subjectAvg(s);
    const grades = (s.grades || []).map(g => gradeCellHtml(s, g)).join('');
    return `<div class="subject-card">
      <div class="subject-card-head">
        <span class="subject-name">${esc(s.name)}</span>

}

let dragLessonId = null;
function initDragDrop(){
  const grid = $('schedule-grid');
  grid.querySelectorAll('.lesson[draggable="true"]').forEach(el => {
    el.addEventListener('dragstart', e => {
      dragLessonId = el.dataset.lesson;
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try{ e.dataTransfer.setData('text/plain', dragLessonId); }catch(_){}
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('dragging');
      grid.querySelectorAll('.lesson.drag-target').forEach(x => x.classList.remove('drag-target'));
      grid.querySelectorAll('.day-col.drag-over').forEach(x => x.classList.remove('drag-over'));
      dragLessonId = null;
    });
    el.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      if(el.dataset.lesson !== dragLessonId){
        grid.querySelectorAll('.lesson.drag-target').forEach(x => x.classList.remove('drag-target'));
        el.classList.add('drag-target');
      }
    });
    el.addEventListener('dragleave', () => el.classList.remove('drag-target'));
    el.addEventListener('drop', e => {
      e.preventDefault(); e.stopPropagation();
      el.classList.remove('drag-target');
      const targetId = el.dataset.lesson;
      const targetDay = el.closest('.day-col').dataset.day;
      moveLesson(dragLessonId, targetId, targetDay);
    });
  });
  grid.querySelectorAll('.day-col').forEach(col => {
    col.addEventListener('dragover', e => {
      if(!dragLessonId) return;
      e.preventDefault();
      col.classList.add('drag-over');
    });
    col.addEventListener('dragleave', e => {
      if(!col.contains(e.relatedTarget)) col.classList.remove('drag-over');
    });
    col.addEventListener('drop', e => {
      e.preventDefault();
      col.classList.remove('drag-over');
      const day = col.dataset.day;
      const lessonEl = e.target.closest('.lesson');
      if(lessonEl) moveLesson(dragLessonId, lessonEl.dataset.lesson, day);
      else moveLesson(dragLessonId, null, day);
    });
  });
}
function moveLesson(srcId, targetId, targetDay){
  if(!srcId) return;
  const st = getCurrentStudent(); if(!st) return;
  const currentData = DataStore.get();
  const s = currentData.students.find(x => x.id === st.id); if(!s) return;
  s.schedule = s.schedule || [];
  const srcIdx = s.schedule.findIndex(l => l.id === srcId);
  if(srcIdx < 0) return;
  const [lesson] = s.schedule.splice(srcIdx, 1);
  lesson.day = targetDay;
  if(targetId){
    const tgtIdx = s.schedule.findIndex(l => l.id === targetId);
    if(tgtIdx >= 0) s.schedule.splice(tgtIdx, 0, lesson);
    else s.schedule.push(lesson);
  }else{
    let lastIdx = -1;
    s.schedule.forEach((l, i) => { if(l.day === targetDay) lastIdx = i; });
    if(lastIdx >= 0) s.schedule.splice(lastIdx + 1, 0, lesson);
    else s.schedule.push(lesson);
  }
  DataStore.save(currentData);
  data = currentData;
  renderAll();
  if(localStorage.getItem('gh_token')) setTimeout(() => publishToGitHubSilent(), 100);
}

function openGradeModal(subjectId, gradeId){
  const st = getCurrentStudent(); if(!st) return;
  const subject = (st.subjects || []).find(s => s.id === subjectId); if(!subject) return;
  const isNew = !gradeId;
  if(isNew && !canAddGrade()) return;
  const grade = isNew ? { id:null, value:5, type: DEFAULT_TYPE, date:todayISO(), comment:'' }
    : (subject.grades || []).find(g => g.id === gradeId);
  if(!grade) return;
  const editable = isAdmin() || (isNew && isStudentRole());
  const dis = editable ? '' : 'disabled';
  const valueOpts = Array.from({length:10}, (_,i) => i + 1)
    .map(v => `<option value="${v}" ${Number(grade.value) === v ? 'selected' : ''}>${v}</option>`).join('');
  const typeOpts = GRADE_TYPES
    .map(t => `<option value="${esc(t.name)}" ${grade.type === t.name ? 'selected' : ''}>${esc(t.name)}</option>`).join('');
  openModal(`
    <h2>${isNew ? 'Новая оценка' : 'Оценка'} — ${esc(subject.name)}</h2>

      }
      DataStore.save(currentData); data = currentData; renderAll(); closeModal();
          // Автопубликация — только для админа
      if(isAdmin() && localStorage.getItem('gh_token')){
        setTimeout(() => publishToGitHubSilent(), 100);

      if(isStudentRole() && currentUser){

          status: 'pending', action: isNew ? 'add' : 'update',
          subjectId: subject.id, subjectName: subject.name, gradeId: savedGradeId,

        try{
          await submitChangeToPending(change);

  if(delBtn){
    delBtn.addEventListener('click', () => {
      if(!confirm('Удалить эту оценку?')) return;
      const currentData = DataStore.get();
      const s = currentData.students.find(x => x.id === st.id); if(!s) return closeModal();
      const subj = s.subjects.find(x => x.id === subjectId); if(!subj) return closeModal();
      subj.grades = (subj.grades || []).filter(g => g.id !== gradeId);
    DataStore.save(currentData); data = currentData; renderAll(); closeModal();
    if(isAdmin() && localStorage.getItem('gh_token')) setTimeout(() => publishToGitHubSilent(), 100);
    if(isStudentRole() && currentUser){
      try{
        await submitChangeToPending({
          id: uid(), timestamp: new Date().toISOString(), type: 'schedule',
          status: 'pending', action: isNew ? 'add' : 'update',
          studentEmail: currentUser.email, studentName: st.studentName, studentId: st.id,
          lessonId: lessonId || null, lesson: payload
        });
        alert('📤 Заявка на изменение расписания отправлена администратору.');
      }catch(e){
        alert('⚠️ Расписание сохранено локально, но заявка не отправлена:\n' + e.message);
      }
    }
  });
  }
}

function openLessonModal(lessonId, day){
  if(!canEditSchedule()) return;
  const st = getCurrentStudent(); if(!st) return;
  const isNew = !lessonId;
  const lesson = isNew ? { id:null, day:day || DAYS[0], time:'', subject:'', room:'', homework:'' }
    : (st.schedule || []).find(l => l.id === lessonId);
  if(!lesson) return;
  const catalog = st.catalog || [];
  const subjOpts = catalog.length
    ? catalog.map(c => `<option value="${esc(c)}" ${lesson.subject === c ? 'selected' : ''}>${esc(c)}</option>`).join('')
    : '<option value="">— каталог пуст —</option>';
  const dayOpts = DAYS.map(d => `<option value="${esc(d)}" ${lesson.day === d ? 'selected' : ''}>${esc(d)}</option>`).join('');
  openModal(`
    <h2>${isNew ? 'Новый урок' : 'Урок'}</h2>
    <label><span>День недели</span><select id="m-day">${dayOpts}</select></label>
    <label><span>Предмет</span><select id="m-subject">${subjOpts}</select></label>
    <label><span>Время</span><input id="m-time" placeholder="08:30–09:15" value="${esc(lesson.time || '')}"></label>
    <label><span>Кабинет</span><input id="m-room" placeholder="каб. 12" value="${esc(lesson.room || '')}"></label>
    <label><span>Домашнее задание</span><textarea id="m-hw" rows="3">${esc(lesson.homework || '')}</textarea></label>
    <div class="modal-actions">
      <button id="m-cancel" class="secondary">Отмена</button>
      <button id="m-save">Сохранить</button>
      ${!isNew ? '<button id="m-delete" class="danger">Удалить</button>' : ''}
    </div>
  `);
  $('m-cancel').addEventListener('click', closeModal);
  $('m-save').addEventListener('click', async () => {
    const payload = { day: $('m-day').value, subject: $('m-subject').value,
      time: $('m-time').value.trim(), room: $('m-room').value.trim(), homework: $('m-hw').value.trim() };
    const currentData = DataStore.get();
    const s = currentData.students.find(x => x.id === st.id); if(!s) return closeModal();
    s.schedule = s.schedule || [];
    if(isNew) s.schedule.push(Object.assign({ id: uid() }, payload));
    else{ const l = s.schedule.find(x => x.id === lessonId); if(l) Object.assign(l, payload); }
    DataStore.save(currentData); data = currentData; renderAll(); closeModal();
    if(localStorage.getItem('gh_token')) setTimeout(() => publishToGitHubSilent(), 100);
  });
  const delBtn = $('m-delete');
  if(delBtn){
    delBtn.addEventListener('click', () => {
      if(!confirm('Удалить этот урок?')) return;
      const currentData = DataStore.get();
      const s = currentData.students.find(x => x.id === st.id); if(!s) return closeModal();
      s.schedule = (s.schedule || []).filter(l => l.id !== lessonId);
      DataStore.save(currentData); data = currentData; renderAll(); closeModal();
      if(localStorage.getItem('gh_token')) setTimeout(() => publishToGitHubSilent(), 100);
    });
  }
}

/* ============================================================================
   ДЕЙСТВИЯ
   ============================================================================ */
function addSubjectPrompt(){
  if(!isAdmin()) return;
  const st = getCurrentStudent(); if(!st) return;
  const catalog = st.catalog || [];
  const existing = new Set((st.subjects || []).map(s => s.name.toLowerCase()));
  const available = catalog.filter(c => !existing.has(c.toLowerCase()));
  if(!catalog.length) return alert('Сначала добавьте предметы в каталог.');
  if(!available.length) return alert('Все предметы уже добавлены.');
  const opts = available.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
  openModal(`
    <h2>Добавить предмет</h2>
    <label><span>Предмет</span><select id="m-subject-catalog">${opts}</select></label>
    <div class="modal-actions">
      <button id="m-cancel" class="secondary">Отмена</button>
      <button id="m-save">Добавить</button>
    </div>
  `);
  $('m-cancel').addEventListener('click', closeModal);
  $('m-save').addEventListener('click', () => {
    const name = $('m-subject-catalog').value; if(!name) return closeModal();
    const currentData = DataStore.get();
    const s = currentData.students.find(x => x.id === st.id); if(!s) return closeModal();
    s.subjects = s.subjects || []; s.subjects.push({ id: uid(), name, grades: [] });
    DataStore.save(currentData); data = currentData; renderAll(); closeModal();
    if(localStorage.getItem('gh_token')) setTimeout(() => publishToGitHubSilent(), 100);
  });
}
function deleteSubject(subjectId){
  if(!isAdmin()) return;
  const st = getCurrentStudent(); if(!st) return;
  const s_ = (st.subjects || []).find(x => x.id === subjectId); if(!s_) return;
  if(!confirm(`Удалить предмет «${s_.name}»?`)) return;
  const currentData = DataStore.get();
  const s = currentData.students.find(x => x.id === st.id);
  s.subjects = s.subjects.filter(x => x.id !== subjectId);
  DataStore.save(currentData); data = currentData; renderAll();
  if(localStorage.getItem('gh_token')) setTimeout(() => publishToGitHubSilent(), 100);
}
function addCatalogItem(){
  if(!isAdmin() && !isStudentRole()) return;
  const st = getCurrentStudent(); if(!st) return;
  const val = ($('catalog-input').value || '').trim(); if(!val) return;
  const currentData = DataStore.get();
  const s = currentData.students.find(x => x.id === st.id);
  s.catalog = s.catalog || [];
  if(s.catalog.some(c => c.toLowerCase() === val.toLowerCase())) return alert('Уже есть.');
  s.catalog.push(val);
  DataStore.save(currentData); data = currentData; renderAll();
}
function deleteCatalogItem(index){
  if(!isAdmin() && !isStudentRole()) return;
  const st = getCurrentStudent(); if(!st) return;
  const currentData = DataStore.get();
  const s = currentData.students.find(x => x.id === st.id);
  s.catalog.splice(index, 1);
  DataStore.save(currentData); data = currentData; renderAll();
}
function inviteUser(){
  if(!isAdmin()) return;
  const email = ($('invite-email').value || '').trim().toLowerCase();
  const role_ = $('invite-role').value;
  if(!email || email.indexOf('@') < 0) return alert('Введите корректный email');
  if(Users.findEmail(email)) return alert('Email уже зарегистрирован');
  if(Invites.findByEmail(email)) return alert('Приглашение уже существует');
  Invites.add({ id: uid(), email, role: role_, invitedBy: currentUser.email });
  invites = Invites.all();
  $('invite-email').value = '';
   renderCabinet();
}
function deleteInvite(id){
  if(!isAdmin()) return;
  if(!confirm('Удалить приглашение?')) return;
  Invites.remove(id);
  invites = Invites.all();
  renderCabinet();
}
function generateInviteFile(invite){
  if(!isAdmin() || !invite || !invite.email) return;
  const inject = '<script>window.__APP_INVITE=' + JSON.stringify({ email: invite.email, role: invite.role || 'viewer' }) + ';<\/script>';
  const html = APP_HTML_SNAPSHOT.replace(/<head>/i, '<head>\n' + inject);
  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const safe = invite.email.replace(/[^a-z0-9]+/gi, '_');
  const a = document.createElement('a');
  a.href = url; a.download = 'invite-' + safe + '.html';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function exportJSON(){
  const payload = { app: 'school-progress', version: 3, exportedAt: new Date().toISOString(), data };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `school-progress-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function importJSON(file){
  if(!isAdmin()) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const parsed = JSON.parse(e.target.result);
      const raw = parsed.data ? parsed.data : parsed;
      if(!raw || typeof raw !== 'object') throw new Error('Неверный формат');
      if(!confirm('Импорт заменит данные ВСЕХ учеников и пользователей. Продолжить?')) return;
      data = normalizeData(raw); DataStore.save(data);
      if(Array.isArray(data.users)) Users.save(data.users);
      currentStudentId = data.students[0] ? data.students[0].id : null;
      renderAll(); alert('Импорт выполнен.');
    }catch(err){ alert('Ошибка: ' + err.message); }
  };
  reader.readAsText(file);
}
function resetAll(){
  if(!isAdmin()) return;
  if(!confirm('Удалить ВСЕ данные?')) return;
  if(!confirm('Последнее подтверждение?')) return;
  data = defaultData(); DataStore.save(data); currentStudentId = null;
  renderAll(); alert('Сброшено.');
}

/* ============================================================================
   PDF
   ============================================================================ */
async function exportToPDF(){
  const st = getCurrentStudent();
  if(!st) return alert('Ученик не найден.');
  const subjects = st.subjects || [];
  if(!subjects.length) return alert('Оценок пока нет.');
  const gpa = overallGpa();
  const rowsHtml = subjects.map(s => {
    const grades = (s.grades || []).map(g =>
      `<span style="display:inline-block;padding:3px 7px;margin:2px;border:1px solid #999;border-radius:5px;font-weight:700">${esc(String(g.value))}</span>`
    ).join('') || '<span style="color:#999">—</span>';
    const avg = subjectAvg(s);
    return `<tr>
      <td style="padding:7px 10px;border-bottom:1px solid #ddd;font-weight:600">${esc(s.name)}</td>
      <td style="padding:7px 10px;border-bottom:1px solid #ddd">${grades}</td>
      <td style="padding:7px 10px;border-bottom:1px solid #ddd;text-align:center;font-weight:800;color:${avg!==null?gpaColor(avg):'#999'}">${avg!==null?avg.toFixed(2):'—'}</td>
    </tr>`;
  }).join('');
  const html = `
    <div style="font-family:Arial,sans-serif;color:#000;background:#fff">
      <h1 style="text-align:center;margin:0 0 6px;font-size:20px">Ведомость оценок</h1>
      <p style="text-align:center;margin:0 0 4px;font-size:14px"><b>${esc(st.studentName || '')}</b></p>
      <p style="text-align:center;margin:0 0 18px;font-size:12px;color:#555">
        Дата: ${new Date().toLocaleDateString('ru-RU')} · Средний балл: <b>${gpa!==null?gpa.toFixed(2):'—'}</b>
      </p>
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead><tr style="background:#eaeaea">
          <th style="padding:8px 10px;text-align:left">Предмет</th>
          <th style="padding:8px 10px;text-align:left">Оценки</th>
          <th style="padding:8px 10px;text-align:center">Ср. балл</th>
        </tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
      <p style="margin-top:22px;font-size:11px;color:#666;text-align:center">
        Сгенерировано автоматически · Учёт успеваемости
      </p>
    </div>`;
  const wrap = document.createElement('div');
  wrap.innerHTML = html;
  wrap.style.cssText = 'position:absolute;left:-9999px;top:0;width:190mm;background:#fff;color:#000;padding:15mm;box-sizing:border-box';
  document.body.appendChild(wrap);
  const safeName = (st.studentName || 'student').replace(/[^а-яёa-z0-9]+/gi, '_');
  try{
    await html2pdf().set({
      margin: 0, filename: `tabel-${safeName}-${todayISO()}.pdf`,
      image: { type: 'jpeg', quality: 0.95 },
      html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    }).from(wrap).save();
  }catch(e){ alert('Ошибка PDF: ' + e.message); }
  finally{ document.body.removeChild(wrap); }
}

/* ============================================================================
   ПОДСКАЗКИ
   ============================================================================ */
const tipEl = $('tooltip');
let tipTimer = null;
let longPressFired = false;
function buildTipHtml(el){
  const type    = el.dataset.ttype || DEFAULT_TYPE;
  const date    = el.dataset.tdate ? formatDate(el.dataset.tdate) : '—';
  const comment = el.dataset.tcomment || '';
  return `<div class="tip-row"><b>${esc(type)}</b></div>
          <div class="tip-row">📅 ${esc(date)}</div>
          ${comment ? `<div class="tip-comment">${esc(comment)}</div>` : ''}`;
}
function positionTip(el){
  tipEl.innerHTML = buildTipHtml(el);
  tipEl.style.left = '0px'; tipEl.style.top = '0px';
  tipEl.classList.add('show');
  const r = el.getBoundingClientRect(); const tr = tipEl.getBoundingClientRect();
  let left = r.left + r.width / 2 - tr.width / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - tr.width - 8));
  let top = r.top - tr.height - 10; if(top < 8) top = r.bottom + 10;
  tipEl.style.left = left + 'px'; tipEl.style.top = top + 'px';
}
function hideTip(){ tipEl.classList.remove('show'); clearTimeout(tipTimer); }
document.addEventListener('mouseover', e => {
  const el = e.target.closest && e.target.closest('[data-tip]'); if(!el) return;
  if(e.relatedTarget && el.contains(e.relatedTarget)) return;
  clearTimeout(tipTimer); tipTimer = setTimeout(() => positionTip(el), 800);
});
document.addEventListener('mouseout', e => {
  const el = e.target.closest && e.target.closest('[data-tip]'); if(!el) return;
  if(e.relatedTarget && el.contains(e.relatedTarget)) return;
  hideTip();
});
document.addEventListener('touchstart', e => {
  const el = e.target.closest && e.target.closest('[data-tip]'); if(!el) return;
  longPressFired = false; clearTimeout(tipTimer);
  tipTimer = setTimeout(() => { longPressFired = true; positionTip(el); }, 550);
}, { passive: true });
document.addEventListener('touchmove', () => { hideTip(); longPressFired = false; }, { passive: true });
document.addEventListener('touchend', () => {
  clearTimeout(tipTimer);
  if(longPressFired) setTimeout(hideTip, 1800);
});

/* ============================================================================
   ОБРАБОТЧИКИ
   ============================================================================ */
$('tabs').addEventListener('click', e => {
  const btn = e.target.closest('button[data-tab]'); if(!btn) return;
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b === btn));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  const panel = $('tab-' + btn.dataset.tab); if(panel) panel.classList.add('active');
  if(btn.dataset.tab === 'cabinet' && isAdmin()) refreshPending();
  if(btn.dataset.tab === 'users' && isAdmin()) renderUsersTab();
});
$('grades-actions').addEventListener('click', e => {
  if(e.target.closest('#add-subject-btn')) addSubjectPrompt();
  if(e.target.closest('#print-btn')) window.print();
  if(e.target.closest('#pdf-btn')) exportToPDF();
  if(e.target.closest('#publish-quick-btn')) return publishToGitHub();
});
function handleGradesClick(e){
  const g = e.target.closest('.grade');
  if(g) return openGradeModal(g.dataset.subject, g.dataset.grade);
  const add = e.target.closest('[data-add-grade]');
  if(add) return openGradeModal(add.dataset.addGrade, null);
  const del = e.target.closest('[data-del-subject]');
  if(del) return deleteSubject(del.dataset.delSubject);
}
$('grades-table').addEventListener('click', handleGradesClick);
$('grades-cards').addEventListener('click', handleGradesClick);
function handleGradesTouchEnd(e){
  const g = e.target.closest('.grade'); if(!g) return;
  if(longPressFired){ longPressFired = false; return; }
  e.preventDefault(); openGradeModal(g.dataset.subject, g.dataset.grade);
}
$('grades-table').addEventListener('touchend', handleGradesTouchEnd, { passive: false });
$('grades-cards').addEventListener('touchend', handleGradesTouchEnd, { passive: false });
$('schedule-grid').addEventListener('click', e => {
  if(e.target.closest('.lesson-drag')) return;
  const add = e.target.closest('[data-add-lesson]');
  if(add) return openLessonModal(null, add.dataset.addLesson);
  const lesson = e.target.closest('[data-lesson]');
  if(lesson && canEditSchedule()) return openLessonModal(lesson.dataset.lesson, null);
});
$('cabinet-content').addEventListener('click', e => {
  const pf = e.target.closest('[data-pfilter]');
  if(pf){ pendingFilter = pf.dataset.pfilter; renderCabinet(); return; }
  const appr = e.target.closest('[data-approve]'); if(appr) return approveChange(appr.dataset.approve);
  const rej = e.target.closest('[data-reject]'); if(rej) return rejectChange(rej.dataset.reject);
  if(e.target.closest('#refresh-pending-btn')) return refreshPending();
  if(e.target.closest('#catalog-add')) return addCatalogItem();
  const catDel = e.target.closest('[data-catalog-del]');
  if(catDel) return deleteCatalogItem(Number(catDel.dataset.catalogDel));
  if(e.target.closest('#invite-btn')) return inviteUser();
  const invDel = e.target.closest('[data-invite-del]');
  if(invDel) return deleteInvite(invDel.dataset.inviteDel);
  const invDl = e.target.closest('[data-invite-download]');
  if(invDl){
    const inv = Invites.all().find(x => x.id === invDl.dataset.inviteDownload);
    if(inv) return generateInviteFile(inv);
    return;
  }
  if(e.target.closest('#publish-btn')) return publishToGitHub();
  if(e.target.closest('#sync-btn')) return syncFromGitHub();
  if(e.target.closest('#forget-token-btn')){
    if(confirm('Удалить сохранённый токен?')){ localStorage.removeItem('gh_token'); alert('Токен удалён.'); }
    return;
  }
  if(e.target.closest('#export-btn')) return exportJSON();
  if(e.target.closest('#import-btn')) return $('import-file').click();
  if(e.target.closest('#reset-btn'))  return resetAll();
});
$('cabinet-content').addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  if(e.target.id === 'catalog-input'){ e.preventDefault(); addCatalogItem(); }
  if(e.target.id === 'invite-email'){ e.preventDefault(); inviteUser(); }
});
$('cabinet-content').addEventListener('change', e => {
  if(e.target.id === 'import-file' && e.target.files[0]){
    importJSON(e.target.files[0]); e.target.value = '';
  }
  if(e.target.id === 'student-name-input'){
    if(!isAdmin() && !isStudentRole()) return;
    const st = getCurrentStudent(); if(!st) return;
    const newName = e.target.value.trim(); if(!newName) return;
    const currentData = DataStore.get();
    const s = currentData.students.find(x => x.id === st.id); if(!s) return;
    s.studentName = newName;
    DataStore.save(currentData); data = currentData;
    if(currentUser.studentId === st.id) Users.update(currentUser.uid, { name: newName });
    renderAll();
    if(localStorage.getItem('gh_token')) setTimeout(() => publishToGitHubSilent(), 100);
  }
});
$('users-content').addEventListener('change', e => {
  const sel = e.target.closest('select[data-role-uid]'); if(!sel) return;
  const uid_ = sel.dataset.roleUid; const newRole = sel.value;
  if(!isAdmin()) return;
  if(currentUser && uid_ === currentUser.uid){ alert('Нельзя менять роль себе.'); renderUsersTab(); return; }
  const u = Users.findId(uid_) || (data.users || []).find(x => x.uid === uid_);
  if(!u){ renderUsersTab(); return; }
  Users.update(uid_, { role: newRole });
  if(data.users){ const du = data.users.find(x => x.uid === uid_); if(du) du.role = newRole; }
  DataStore.save(data);
  renderUsersTab();
  if(localStorage.getItem('gh_token')) setTimeout(() => publishToGitHubSilent(), 100);
});
$('users-content').addEventListener('click', async e => {
  const del = e.target.closest('[data-del-user]'); if(!del) return;
  if(!isAdmin()) return;
  const uid_ = del.dataset.delUser;
  const u = Users.findId(uid_) || (data.users || []).find(x => x.uid === uid_); if(!u) return;
  if(currentUser && uid_ === currentUser.uid) return alert('Нельзя удалить себя.');
  const src = (data.users && data.users.length) ? data.users : Users.all();
  const adminsCount = src.filter(x => x.role === 'admin').length;
  if(u.role === 'admin' && adminsCount === 1) return alert('Нельзя удалить последнего админа.');
  if(!confirm('Удалить ' + u.email + '?\n\nПользователь больше никогда не сможет войти.')) return;
  const deletedEmail = u.email;
  // Добавляем в blacklist — чтобы не вернулся при синхронизации
  data.deletedEmails = data.deletedEmails || [];
  if(!data.deletedEmails.includes(deletedEmail)) data.deletedEmails.push(deletedEmail);
  // Удаляем из локального и из data
  Users.remove(uid_);
  if(data.users) data.users = data.users.filter(x => x.uid !== uid_);
  DataStore.save(data);
  renderUsersTab();
  // Автопубликация
  if(localStorage.getItem('gh_token')){
    const ok = await publishToGitHubSilent();
    if(ok) alert('✅ Пользователь удалён и данные опубликованы.');
    else alert('✅ Пользователь удалён локально. Нажмите «📤 Опубликовать», чтобы удалить и на GitHub.');
  }else{
    alert('✅ Пользователь удалён локально. Нажмите «📤 Опубликовать», чтобы удалить и на GitHub.');
  }
});
window.addEventListener('scroll', hideTip, { passive: true });
window.addEventListener('resize', hideTip);

/* ============================================================================
   СТАРТ
   ============================================================================ */
bootSession();
</script>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<meta name="theme-color" content="#4f7cff">
<title>📚 Успеваемость</title>
<!-- favicon-заглушка, чтобы не было 404 -->
<link rel="icon" href="data:,">
<!-- Единственная внешняя библиотека: генерация PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
<style>
/* ============================================================
   ПЕРЕМЕННЫЕ ТЕМЫ
   ============================================================ */
:root{
  --bg:#eef1f7;
  --bg2:#f7f9fc;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --border:#e3e7ef;
  --input:#f7f9fc;
  --accent:#4f7cff;
  --accent2:#7c5cff;
  --danger:#ef4444;
  --ok:#16a34a;
  --shadow:0 2px 12px rgba(17,24,39,.07);
  --shadow-lg:0 12px 40px rgba(17,24,39,.18);
  --radius:14px;
}
[data-theme="dark"]{
  --bg:#0d1220;
  --bg2:#131a2b;
  --card:#161e30;
  --text:#e8ecf5;
  --muted:#94a3b8;
  --border:#26304a;
  --input:#1d2639;
  --shadow:0 2px 12px rgba(0,0,0,.45);
  --shadow-lg:0 12px 40px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--text);
  font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
h1,h2,h3{margin:0;font-weight:700}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:var(--text)}
a{color:var(--accent)}

/* ============================================================
   БАЗОВЫЕ КОМПОНЕНТЫ
   ============================================================ */
.btn{
  border:1px solid var(--border);background:var(--card);color:var(--text);
  padding:9px 15px;border-radius:10px;font-weight:600;font-size:14px;
  transition:.15s;display:inline-flex;align-items:center;gap:6px;justify-content:center;
}
.btn:hover{filter:brightness(.97);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.btn.danger{background:var(--danger);color:#fff;border-color:transparent}
.btn.ok{background:var(--ok);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;padding:10px 12px;border:1px solid var(--border);
  background:var(--input);border-radius:10px;outline:none;transition:.15s;
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,124,255,.15)
}
textarea{resize:vertical;min-height:70px}

.panel{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);margin-bottom:16px;
}
.panel h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}

.role-badge{
  display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;
  color:#fff;letter-spacing:.2px;
}
.role-admin{background:linear-gradient(135deg,#f43f5e,#b91c1c)}
.role-student{background:linear-gradient(135deg,#4f7cff,#7c5cff)}
.role-viewer{background:linear-gradient(135deg,#64748b,#475569)}

.chip{
  display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;
  background:var(--input);border:1px solid var(--border);font-size:13px;font-weight:600;
}

/* ============================================================
   ЭКРАН АВТОРИЗАЦИИ
   ============================================================ */
.auth-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(135deg,#4f7cff 0%,#7c5cff 100%);
}
.auth-card{
  width:100%;max-width:400px;background:var(--card);border-radius:20px;padding:28px 24px;
  box-shadow:var(--shadow-lg);
}
.auth-logo{font-size:44px;text-align:center;line-height:1}
.auth-card h1{text-align:center;font-size:23px;margin:8px 0 4px}
.auth-sub{text-align:center;font-size:13.5px;margin-bottom:20px}
.auth-actions{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.auth-actions .btn{width:100%;padding:11px}
.auth-links{text-align:center;margin-top:14px;font-size:13.5px}
.auth-links a{text-decoration:none;font-weight:600}

/* ============================================================
   ШАПКА
   ============================================================ */
.topbar{
  position:sticky;top:0;z-index:60;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 16px;
  background:linear-gradient(135deg,#4f7cff,#7c5cff);
  color:#fff;box-shadow:0 3px 14px rgba(79,124,255,.35);
}
.brand{font-weight:800;font-size:16.5px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.student-switch{
  background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.35);
  border-radius:9px;padding:6px 9px;font-weight:600;font-size:13.5px;max-width:220px;
}
.student-switch option{color:#111827;background:#fff}
.topbar .chip{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35);color:#fff}
.avg-chip{font-size:14px}
.topbar-spacer{flex:1}
.icon-btn{
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;
  width:34px;height:34px;border-radius:9px;font-size:16px;display:flex;align-items:center;justify-content:center;
}
.user-box{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;white-space:nowrap}
.topbar .btn{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.35);color:#fff}

/* ============================================================
   ВКЛАДКИ
   ============================================================ */
.tabs{
  display:flex;gap:6px;padding:10px 16px 0;background:var(--bg2);
  border-bottom:1px solid var(--border);position:sticky;top:52px;z-index:50;
  overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  border:none;background:transparent;color:var(--muted);font-weight:700;font-size:14px;
  padding:9px 14px;border-radius:10px 10px 0 0;white-space:nowrap;position:relative;
}
.tabs button.active{background:var(--card);color:var(--accent);box-shadow:0 -2px 8px rgba(0,0,0,.04)}
.tabs .badge{
  display:inline-block;background:var(--danger);color:#fff;font-size:11px;font-weight:700;
  border-radius:20px;padding:1px 7px;margin-left:5px;vertical-align:middle;
}
main{padding:16px;max-width:1400px;margin:0 auto}

/* ============================================================
   ОЦЕНКИ
   ============================================================ */
.grades-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.grades-table{width:100%;border-collapse:separate;border-spacing:0 6px}
.grades-table th{
  font-size:12px;color:var(--muted);font-weight:700;text-align:center;padding:0 4px 4px;
}
.grades-table th.subj-col{text-align:left;padding-left:12px;min-width:180px}
.grades-table td{
  background:var(--card);border-top:1px solid var(--border);border-bottom:1px solid var(--border);
  padding:8px 6px;vertical-align:middle;
}
.grades-table td:first-child{border-left:1px solid var(--border);border-radius:12px 0 0 12px;padding-left:12px}
.grades-table td:last-child{border-right:1px solid var(--border);border-radius:0 12px 12px 0}
.grades-table td.gcell{text-align:center;width:64px}
.subj-name{font-weight:700;font-size:14.5px}
.subj-meta{display:flex;align-items:center;gap:8px;margin-top:3px}
.avg-mini{font-weight:800;font-size:13px}
.del-x{
  border:none;background:transparent;color:var(--danger);font-size:14px;font-weight:700;
  opacity:.55;padding:0 4px;line-height:1;
}
.del-x:hover{opacity:1}

.grade-box{
  width:48px;height:48px;border:2px solid;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:800;margin:0 auto;background:var(--card);
  transition:.15s;cursor:pointer;
}
.grade-box:hover{transform:scale(1.07)}
.grade-card{
  width:52px;min-height:48px;border-radius:12px;background:var(--card);
  border:1px solid var(--border);border-top:3px solid var(--gc);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  margin:0 auto;padding:3px 2px 3px;cursor:pointer;transition:.15s;
}
.grade-card:hover{transform:scale(1.07)}
.grade-card .gv{font-size:16px;font-weight:800;line-height:1.1;color:var(--gc)}
.grade-card .gb{
  font-size:9px;font-weight:800;color:#fff;border-radius:5px;
  padding:1px 4px;margin-top:2px;letter-spacing:.2px;white-space:nowrap;
}
.grade-add{
  width:34px;height:34px;border-radius:10px;border:1.5px dashed var(--border);
  display:flex;align-items:center;justify-content:center;color:var(--muted);
  font-size:17px;margin:0 auto;cursor:pointer;transition:.15s;
}
.grade-add:hover{border-color:var(--accent);color:var(--accent);background:rgba(79,124,255,.07)}
.empty-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--border)}

/* Мобильные карточки оценок (показываются только на узких экранах) */
.grades-cards{display:none}
.gcard{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px;margin-bottom:10px;box-shadow:var(--shadow);
}
.gcard-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.gcard-list{display:flex;flex-wrap:wrap;gap:8px}

/* ============================================================
   РАСПИСАНИЕ
   ============================================================ */
.sched-grid{
  display:grid;grid-template-columns:repeat(6,minmax(150px,1fr));gap:12px;
  overflow-x:auto;padding-bottom:8px;
}
.sched-col{
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);
  padding:10px;min-height:130px;display:flex;flex-direction:column;gap:8px;
  transition:.15s;
}
.sched-col.dragover{background:rgba(79,124,255,.10);border-color:var(--accent)}
.sched-head{
  font-weight:800;font-size:13px;text-align:center;padding-bottom:7px;
  border-bottom:1px solid var(--border);color:var(--accent);
}
.sched-body{display:flex;flex-direction:column;gap:8px;flex:1}
.lesson-card{
  background:var(--card);border:1px solid var(--border);border-left:3px solid var(--accent);
  border-radius:10px;padding:8px 9px;box-shadow:0 1px 4px rgba(0,0,0,.05);
  cursor:pointer;transition:.15s;
}
.lesson-card:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.lesson-card.dragging{opacity:.4}
.lesson-subj{font-weight:700;font-size:13.5px}
.lesson-time{font-size:12px;color:var(--muted);margin-top:1px}
.lesson-room{font-size:12px;color:var(--muted)}
.lesson-hw{
  font-size:12px;color:var(--muted);background:var(--input);border-radius:7px;
  padding:5px 7px;margin-top:6px;white-space:pre-wrap;word-break:break-word;
}
.add-lesson{
  font-size:12.5px;padding:6px;border-radius:9px;border-style:dashed;width:100%;
}

/* ============================================================
   ЛИЧНЫЙ КАБИНЕТ
   ============================================================ */
.profile-grid{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:16px;align-items:start}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px;border-bottom:1px dashed var(--border)}
.kv:last-child{border-bottom:none}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-weight:600;text-align:right;word-break:break-word}

.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:11px}
.pill{
  display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:20px;
  background:var(--input);border:1px solid var(--border);font-size:13px;font-weight:600;
}
.pill .x{
  border:none;background:transparent;color:var(--danger);font-weight:800;font-size:13px;
  padding:0;line-height:1;opacity:.6;
}
.pill .x:hover{opacity:1}
.inline-form{display:flex;gap:8px}
.inline-form input{flex:1;padding:9px 11px;border:1px solid var(--border);background:var(--input);border-radius:10px;outline:none}

.stat-row{display:flex;align-items:center;gap:9px;margin-bottom:7px;font-size:13.5px}
.stat-name{width:130px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.stat-bar{
  flex:1;height:20px;background:var(--input);border-radius:10px;overflow:hidden;position:relative;
  border:1px solid var(--border);
}
.stat-fill{height:100%;border-radius:10px;transition:width .4s ease}
.stat-count{
  position:absolute;right:7px;top:50%;transform:translateY(-50%);
  font-size:11px;font-weight:700;color:var(--muted);
}
.stat-val{width:44px;text-align:right;font-weight:800;flex-shrink:0}

.req-card{
  border:1px solid var(--border);border-radius:12px;padding:11px;margin-bottom:9px;background:var(--bg2);
}
.req-card .req-top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}
.req-type{font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:20px;background:var(--accent);color:#fff}
.req-desc{font-size:13.5px;margin-bottom:9px;word-break:break-word}
.req-actions{display:flex;gap:7px}
.req-filters{display:flex;gap:6px;margin-bottom:11px;flex-wrap:wrap}

.invite-item{
  display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:13.5px;
}
.invite-item:last-child{border-bottom:none}
.invite-item .em{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ============================================================
   ТАБЛИЦА ПОЛЬЗОВАТЕЛЕЙ
   ============================================================ */
.users-table{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--card);
  border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.users-table th{background:var(--bg2);text-align:left;padding:10px;font-size:12px;color:var(--muted);font-weight:700}
.users-table td{padding:9px 10px;border-top:1px solid var(--border);vertical-align:middle}
.users-table select{padding:5px 8px;border-radius:8px;border:1px solid var(--border);background:var(--input)}

/* ============================================================
   МОДАЛЬНЫЕ ОКНА
   ============================================================ */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(15,20,32,.55);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;z-index:200;padding:16px;
  overflow-y:auto;
}
.modal-backdrop.show{display:flex}
.modal{
  background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:440px;
  box-shadow:var(--shadow-lg);animation:pop .18s ease;max-height:92vh;overflow-y:auto;
}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{margin-bottom:14px;font-size:17px}
.modal-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.modal-actions .btn{flex:1;min-width:110px}

/* ============================================================
   ПОДСКАЗКА (TOOLTIP)
   ============================================================ */
#tooltip{
  position:fixed;z-index:300;max-width:250px;background:#111827;color:#fff;
  border-radius:10px;padding:9px 11px;font-size:12.5px;line-height:1.4;
  box-shadow:0 8px 24px rgba(0,0,0,.35);display:none;pointer-events:none;
}
#tooltip b{display:block;margin-bottom:3px;font-size:13px}
#tooltip .tt-date{opacity:.75;font-size:11.5px;margin-bottom:4px}

/* ============================================================
   ТОСТ
   ============================================================ */
#toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);
  background:#111827;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;
  font-weight:600;z-index:400;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============================================================
   PDF-ДОКУМЕНТ
   ============================================================ */
.pdf-doc{width:760px;padding:24px;background:#fff;color:#111827;font-family:Arial,sans-serif}
.pdf-doc h2{text-align:center;margin-bottom:6px;font-size:22px}
.pdf-doc .pdf-sub{text-align:center;color:#555;font-size:13px;margin-bottom:16px}
.pdf-doc table{width:100%;border-collapse:collapse;font-size:13px}
.pdf-doc th,.pdf-doc td{border:1px solid #cbd5e1;padding:6px 8px}
.pdf-doc th{background:#eef2ff;text-align:left}
.pdf-chip{
  display:inline-block;min-width:24px;text-align:center;border-radius:5px;color:#fff;
  font-weight:700;padding:1px 5px;margin:1px;font-size:12px;
}

/* ============================================================
   АДАПТИВ
   ============================================================ */
@media (max-width:820px){
  body{font-size:14.5px}
  main{padding:12px}
  .topbar{padding:8px 12px;gap:7px}
  .brand span{display:none}
  .student-switch{max-width:130px;font-size:13px}
  .user-box{font-size:12px}
  .user-box .em{display:none}
  .tabs{top:auto;position:relative;padding:8px 12px 0}
  .profile-grid{grid-template-columns:1fr}
  .grades-table{display:none}
  .grades-cards{display:block}
  .sched-grid{grid-template-columns:repeat(6,minmax(160px,1fr))}
  .stat-name{width:100px}
  .users-table{font-size:12.5px}
  .users-table th,.users-table td{padding:7px 6px}
}

/* ============================================================
   ПЕЧАТЬ
   ============================================================ */
#printArea{display:none}
@media print{
  body{background:#fff}
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{
    display:block;position:absolute;left:0;top:0;width:100%;padding:0;color:#000;
  }
  #printArea h2{text-align:center;font-size:20px;margin-bottom:4px}
  #printArea .p-sub{text-align:center;font-size:12px;color:#444;margin-bottom:14px}
  #printArea table{width:100%;border-collapse:collapse;font-size:12px}
  #printArea th,#printArea td{border:1px solid #999;padding:5px 7px;text-align:left}
  #printArea th{background:#eee}
}
</style>
</head>
<body>

<!-- ============================ ЭКРАН ВХОДА ============================ -->
<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <div class="auth-logo">📚</div>
    <h1>Успеваемость</h1>
    <p class="muted auth-sub" id="authSub">Вход в дневник школьника</p>

    <div class="field">
      <label>Email</label>
      <input id="authEmail" type="email" autocomplete="username" placeholder="you@example.com">
    </div>
    <div class="field">
      <label>Пароль</label>
      <input id="authPass" type="password" autocomplete="current-password" placeholder="••••••">
    </div>
    <div class="field" id="authNameField" style="display:none">
      <label>ФИО учащегося</label>
      <input id="authName" type="text" placeholder="Иванов Иван">
    </div>

    <div class="auth-actions">
      <button class="btn primary" id="btnPrimary">Войти</button>
      <button class="btn" id="btnSecondary">Зарегистрироваться</button>
    </div>
    <div class="auth-links">
      <a href="#" id="btnForgot">Забыли пароль?</a>
    </div>
  </div>
</div>

<!-- ============================ ОСНОВНОЕ ПРИЛОЖЕНИЕ ============================ -->
<div id="appScreen" style="display:none">
  <header class="topbar">
    <div class="brand">📚 <span>Успеваемость</span></div>
    <select class="student-switch" id="studentSwitch" style="display:none"></select>
    <div class="chip avg-chip" id="avgChip">—</div>
    <div class="chip" id="pubChip">⏳ не опубликовано</div>
    <div class="topbar-spacer"></div>
    <button class="icon-btn" id="themeBtn" title="Тема">🌙</button>
    <div class="user-box">
      <span class="em" id="userEmail"></span>
      <span class="role-badge" id="userRole"></span>
    </div>
    <button class="btn small" id="logoutBtn">Выйти</button>
  </header>

  <nav class="tabs" id="tabs">
    <button data-view="grades" class="active">Оценки</button>
    <button data-view="schedule">Расписание</button>
    <button data-view="profile">Личный кабинет <span class="badge" id="pendingBadge" style="display:none">0</span></button>
    <button data-view="users" id="tabUsers" style="display:none">Пользователи</button>
  </nav>

  <main id="viewRoot"></main>

// --- Кодирование/декодирование base64 (UTF-8) для GitHub API ---
function b64encode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH){
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  }
  return btoa(bin);
}
function b64decode(b64){
  const bin = atob(String(b64).replace(/\s/g,''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

// --- Хеширование пароля ---
async function sha256Hex(str){
  if (window.crypto && window.crypto.subtle && window.isSecureContext !== false){
    try{
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
    }catch(e){ /* падаём в fallback */ }
  }
  return simpleHash(str);
}
// Простой fallback-хеш (офлайн / file://)
function simpleHash(str){
  let h1 = 0x811c9dc5, h2 = 0x1000193;
  for (let i = 0; i < str.length; i++){
    const c = str.charCodeAt(i);
    h1 = (h1 ^ c) * 16777619 >>> 0;
    h2 = (h2 + c * (i + 1)) >>> 0;
  }
  let out = '';
  for (let i = 0; i < 8; i++){
    out += ((h1 >>> (i*4)) & 0xf).toString(16);
    out += ((h2 >>> (i*4)) & 0xf).toString(16);
  }
  return out;
}

// Слияние удалённых (с GitHub) данных с локальными
function mergeRemote(remote){
  if (!remote || typeof remote !== 'object') return;

  // Чёрный список удалённых email — объединяем и никогда не удаляем
  const deleted = new Set();
  (data.deletedEmails || []).forEach(e => deleted.add(String(e).toLowerCase()));
  (remote.deletedEmails || []).forEach(e => deleted.add(String(e).toLowerCase()));
  data.deletedEmails = [...deleted];

  // Пользователи: удалённые исключаются навсегда
  const byEmail = new Map();
  (remote.users || []).forEach(u => {
    if (u && u.email && !deleted.has(u.email.toLowerCase())) byEmail.set(u.email.toLowerCase(), u);
  });
  (data.users || []).forEach(u => {
    if (u && u.email && !deleted.has(u.email.toLowerCase()) && !byEmail.has(u.email.toLowerCase())){
      byEmail.set(u.email.toLowerCase(), u); // локальные (ещё не опубликованные) сохраняем
    }
  });
  data.users = [...byEmail.values()];

  // Ученики: удалённые данные с GitHub приоритетнее
  const byId = new Map();
  (data.students || []).forEach(s => byId.set(s.id, s));
  (remote.students || []).forEach(s => {
    if (!s || !s.id) return;
    byId.set(s.id, Object.assign({}, byId.get(s.id) || {}, s));
  });
  data.students = [...byId.values()];

  if (remote.publishedAt) data.publishedAt = remote.publishedAt;
}

/* ============================================================================

function ghHeaders(token){
  return {
    'Authorization': 'Bearer ' + token,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28'
  };
}

// Чтение JSON-файла из репозитория
async function ghGetJson(owner, repo, file, token){
  const url = 'https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + file;
  const r = await fetch(url, { headers: ghHeaders(token), cache: 'no-store' });
  if (r.status === 404) return { sha: null, json: null };
  if (!r.ok) throw new Error('GitHub ' + r.status + ' (' + file + ')');
  const j = await r.json();
  let json = null;
  try{ json = JSON.parse(b64decode(j.content || '')); }catch(e){ json = null; }
  return { sha: j.sha, json };
}

// Запись JSON-файла в репозиторий
async function ghPutJson(owner, repo, file, token, obj, message){
  const url = 'https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + file;
  let sha = null;
  const g = await fetch(url, { headers: ghHeaders(token), cache: 'no-store' });
  if (g.ok){
    try{ sha = (await g.json()).sha; }catch(e){ sha = null; }
  }
  const body = {
    message: message || ('Обновление ' + file),
    content: b64encode(JSON.stringify(obj, null, 2))
  };
  if (sha) body.sha = sha;

  const r = await fetch(url, {
    method: 'PUT',
    headers: Object.assign({ 'Content-Type': 'application/json' }, ghHeaders(token)),
    body: JSON.stringify(body)
  });
  if (!r.ok){
    const t = await r.text().catch(() => '');
    throw new Error('GitHub PUT ' + r.status + ' ' + t.slice(0, 200));
  }
  return r.json();
}

// Чтение списка заявок
async function pendingRead(){
  const url = 'https://api.github.com/repos/' + GH_PENDING.owner + '/' + GH_PENDING.repo + '/contents/' + GH_PENDING.file;
  const r = await fetch(url, { headers: ghHeaders(GH_PENDING.token), cache: 'no-store' });
  if (r.status === 404) return { list: [], sha: null };
  if (!r.ok) throw new Error('Заявки: GitHub ' + r.status);
  const j = await r.json();
  let list = [];
  try{ list = JSON.parse(b64decode(j.content || '')); }catch(e){ list = []; }
  if (!Array.isArray(list)) list = [];
  return { list, sha: j.sha };
}

// Запись списка заявок
async function pendingWrite(list){
  const url = 'https://api.github.com/repos/' + GH_PENDING.owner + '/' + GH_PENDING.repo + '/contents/' + GH_PENDING.file;
  let sha = null;
  const g = await fetch(url, { headers: ghHeaders(GH_PENDING.token), cache: 'no-store' });
  if (g.ok){ try{ sha = (await g.json()).sha; }catch(e){} }
  const body = {
    message: 'Обновление очереди заявок',
    content: b64encode(JSON.stringify(list, null, 2))
  };
  if (sha) body.sha = sha;
  const r = await fetch(url, {
    method: 'PUT',
    headers: Object.assign({ 'Content-Type': 'application/json' }, ghHeaders(GH_PENDING.token)),
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error('Заявки: GitHub PUT ' + r.status);
  return r.json();
}

// Опрос заявок (только админ)
async function pollPending(silent){
  if (!isAdmin()) return;
  try{
    const { list } = await pendingRead();
    const fresh = list.filter(r => !knownPendingIds.has(r.id));
    pendingCache = list;

    if (!silent && fresh.length){
      beep();
      browserNotify('🔔 Новые заявки: ' + fresh.length, fresh.map(r => pendingTitle(r)).join('\n'));
      telegramNotify('🔔 Новые заявки в дневнике: ' + fresh.length + '\n' + fresh.map(r => '• ' + pendingTitle(r)).join('\n'));
    }
    list.forEach(r => knownPendingIds.add(r.id));

    updatePendingBadge();
    if (state.view === 'profile') renderView();
  }catch(e){
    // Тихо игнорируем сетевые ошибки опроса
  }

function pendingTitle(req){
  switch(req.type){
    case 'grade':          return 'Оценка: ' + (req.subjectName || '') + ' — ' + (req.grade ? req.grade.value : '');
    case 'schedule':       return 'Расписание: ' + ((req.lesson && req.lesson.subject) || '');
    case 'new_student':    return 'Новый ученик: ' + (req.studentName || '');
    case 'new_user':       return 'Новый пользователь: ' + ((req.user && req.user.email) || '');
    case 'password_reset': return 'Сброс пароля: ' + ((req.user && req.user.email) || '');
    default:               return 'Заявка';
  }
}

// Применение заявки к данным
function applyPending(req){
  switch(req.type){
    case 'grade': {
      const st = getStudent(req.studentId);
      if (!st) return false;
      let subj = (st.subjects || []).find(s => s.id === req.subjectId);
      if (req.action === 'delete'){
        if (subj) subj.grades = (subj.grades || []).filter(g => g.id !== req.gradeId);
        return true;
      }
      if (!subj){
        subj = { id: req.subjectId || uid(), name: req.subjectName || 'Предмет', grades: [] };
        st.subjects.push(subj);
      }
      subj.grades = subj.grades || [];
      const gData = Object.assign({}, req.grade || {});
      if (req.action === 'update'){
        const g = subj.grades.find(x => x.id === req.gradeId);
        if (g) Object.assign(g, gData);
        else subj.grades.push(Object.assign({ id: req.gradeId || uid() }, gData));
      }else{
        if (!subj.grades.some(x => x.id === req.gradeId)){
          subj.grades.push(Object.assign({ id: req.gradeId || uid() }, gData));
        }
      }
      return true;
    }
    case 'schedule': {
      const st = getStudent(req.studentId);
      if (!st) return false;
      st.schedule = st.schedule || [];
      if (req.action === 'delete'){
        st.schedule = st.schedule.filter(l => l.id !== req.lessonId);
        return true;
      }
      const lData = Object.assign({ id: req.lessonId || uid() }, req.lesson || {});
      const idx = st.schedule.findIndex(l => l.id === lData.id);
      if (idx >= 0) st.schedule[idx] = Object.assign({}, st.schedule[idx], lData);
      else st.schedule.push(lData);
      return true;
    }
    case 'new_student': {
      if (req.studentId && !getStudent(req.studentId)){
        data.students.push(Object.assign({
          id: req.studentId, studentName: req.studentName || 'Ученик',
          subjects: [], schedule: [], catalog: DEFAULT_CATALOG.slice(),
          members: [], createdAt: new Date().toISOString()
        }, req.student || {}));
      }
      return true;
    }
    case 'new_user': {
      const u = req.user || {};
      if (u.email && !findUserByEmail(u.email) && !isDeletedEmail(u.email)){
        data.users.push(u);
      }
      return true;
    }
    case 'password_reset': {
      const u = findUserByEmail((req.user || {}).email);
      if (u){
        u.salt = req.user.salt;
        u.passwordHash = req.user.passwordHash;
      }
      return true;
    }
  }
  return false;
}

// Одобрение заявки
async function approvePending(id){
  const req = pendingCache.find(r => r.id === id);
  if (!req) return;
  try{
    applyPending(req);
    const { list } = await pendingRead();
    const next = list.filter(r => r.id !== id);
    await pendingWrite(next);
    pendingCache = next;
    saveData();
    await publishToGitHubSilent();
    renderAll();
    toast('✅ Заявка принята');
  }catch(e){
    alert('Ошибка одобрения: ' + e.message);
  }
}

async function rejectPending(id){

  try{

    await pendingWrite(next);
    pendingCache = next;
    updatePendingBadge();
    renderView();
    toast('Заявка отклонена');

// Звуковой сигнал через Web Audio API
function beep(){
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 800;
    gain.gain.setValueAtTime(0.001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.16);
    setTimeout(() => { try{ ctx.close(); }catch(e){} }, 500);
  }catch(e){}
}

let tooltipTimer = null;
let tooltipTouchTimer = null;
let tooltipHideTimer = null;

function showTooltip(el){
  const subjId  = el.dataset.subj;
  const gradeId = el.dataset.grade;
  const st = currentStudent();
  if (!st) return;
  const subj = (st.subjects || []).find(s => s.id === subjId);
  if (!subj) return;
  const g = (subj.grades || []).find(x => x.id === gradeId);
  if (!g) return;

  const tt = document.getElementById('tooltip');
  const short = typeShort(g.type);
  tt.innerHTML =
    (short ? '<b>' + esc(g.type) + '</b>' : '<b>Оценка</b>') +
    '<div class="tt-date">' + esc(fmtDate(g.date) || 'без даты') + ' · ' + esc(subj.name) + '</div>' +
    (g.comment ? '<div>' + esc(g.comment) + '</div>' : '');

  tt.style.display = 'block';
  const r = el.getBoundingClientRect();
  const tw = tt.offsetWidth, th = tt.offsetHeight;
  let left = r.left + r.width/2 - tw/2;
  let top  = r.top - th - 9;
  if (top < 6) top = r.bottom + 9;           // не помещается сверху — показываем снизу
  if (left < 6) left = 6;
  if (left + tw > window.innerWidth - 6) left = window.innerWidth - tw - 6;
  tt.style.left = left + 'px';
  tt.style.top  = top + 'px';
}

function hideTooltip(){
  clearTimeout(tooltipTimer);
  clearTimeout(tooltipTouchTimer);
  document.getElementById('tooltip').style.display = 'none';
}

// Навешиваем обработчики подсказок на элементы оценок
function bindGradeTooltips(root){
  root.querySelectorAll('[data-grade]').forEach(el => {
    // ПК: задержка 800 мс
    el.addEventListener('mouseenter', () => {
      clearTimeout(tooltipTimer);
      tooltipTimer = setTimeout(() => showTooltip(el), 800);
    });
    el.addEventListener('mouseleave', hideTooltip);
    // Android: долгий тап 550 мс
    el.addEventListener('touchstart', () => {
      clearTimeout(tooltipTouchTimer);
      tooltipTouchTimer = setTimeout(() => showTooltip(el), 550);
    }, { passive: true });
    el.addEventListener('touchmove', () => clearTimeout(tooltipTouchTimer), { passive: true });
    el.addEventListener('touchend', () => {
      clearTimeout(tooltipTouchTimer);
      clearTimeout(tooltipHideTimer);
      tooltipHideTimer = setTimeout(hideTooltip, 2500);
    });
  });
}

// Регистрация: шаг 1 — запрос кода
async function startRegistration(){
  const email = (document.getElementById('authEmail').value || '').trim().toLowerCase();
  const pass  = document.getElementById('authPass').value || '';
  const name  = (document.getElementById('authName').value || '').trim();

  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ alert('Введите корректный email'); return; }
  if (pass.length < 4){ alert('Пароль должен быть не короче 4 символов'); return; }
  if (!name){ alert('Введите ФИО учащегося'); return; }
  if (isDeletedEmail(email)){ alert('Этот email заблокирован администратором.'); return; }
  if (findUserByEmail(email)){ alert('Пользователь с таким email уже существует'); return; }

  const code = String(Math.floor(100 + Math.random() * 900));
  const payload = {
    email: email, name: name, password: pass, code: code,
    expires: Date.now() + 10 * 60 * 1000, tries: 0
  };
  localStorage.setItem(LS.verReg, JSON.stringify(payload));

  const sent = await deliverCode(email, code, 'Код регистрации в дневнике');
  const hint = sent
    ? 'Код отправлен на ' + esc(email) + '. Введите его ниже.'
    : 'EmailJS не настроен. Ваш код: <b style="font-size:20px;color:var(--accent)">' + code + '</b>';

  askCode('Подтверждение регистрации', hint, async (v) => {
    const p = JSON.parse(localStorage.getItem(LS.verReg) || 'null');
    if (!p) return 'Сессия регистрации истекла';
    if (Date.now() > p.expires) return 'Код истёк, начните заново';
    if (p.tries >= 5) return 'Слишком много попыток';
    if (v !== p.code){ p.tries++; localStorage.setItem(LS.verReg, JSON.stringify(p)); return 'Неверный код'; }

    localStorage.removeItem(LS.verReg);
    await finishRegistration(p);
    return null;
  });
}

// Регистрация: шаг 2 — создание пользователя
async function finishRegistration(p){
  const salt = makeSalt();
  const passwordHash = await hashPassword(p.password, salt);

  // Определяем роль
  let role = 'viewer';
  const invites = getInvites();
  const inv = invites.find(i => String(i.email).toLowerCase() === p.email);
  if (p.email === ADMIN_EMAIL.toLowerCase()) role = 'admin';
  else if (inv) role = inv.role || 'viewer';

  const user = {
    uid: uid(),
    email: p.email,
    name: p.name,
    role: role,
    studentId: null,
    salt: salt,
    passwordHash: passwordHash,
    createdAt: new Date().toISOString()
  };

  // Первый зарегистрированный — всегда админ
  if (!data.users.length && !data.students.length) user.role = 'admin';

  // Ищем/создаём ученика по ФИО
  const st = ensureStudent(user, p.name);
  user.studentId = st.id;

  data.users.push(user);

  // Приглашение использовано — убираем
  if (inv){
    saveInvites(invites.filter(i => i !== inv));
  }

  saveData();

  // Заявка администратору
  await sendPending({
    type: 'new_user',
    action: 'add',
    studentEmail: user.email,
    studentName: user.name,
    studentId: st.id,
    user: user
  });

  // Админ публикует сразу (если есть токен)
  if (user.role === 'admin' && hasToken()){
    await publishToGitHubSilent();
  }

  // Автовход
  state.user = user;
  state.studentId = user.studentId;
  localStorage.setItem(LS.session, user.uid);
  enterApp();
  toast('✅ Регистрация завершена. Роль: ' + roleLabel(user.role));
}

// Вход
async function doLogin(){
  const email = (document.getElementById('authEmail').value || '').trim().toLowerCase();
  const pass  = document.getElementById('authPass').value || '';
  if (!email || !pass){ alert('Введите email и пароль'); return; }
  if (isDeletedEmail(email)){ alert('Этот аккаунт удалён администратором.'); return; }

  let user = findUserByEmail(email);
  if (!user){
    // Пробуем подтянуть свежие данные с GitHub
    try{
      const remote = await loadPublishedData();
      mergeRemote(remote);
      saveData();
      user = findUserByEmail(email);
    }catch(e){}
  }
  if (!user){ alert('Пользователь не найден'); return; }

  const hash = await hashPassword(pass, user.salt || '');
  if (hash !== user.passwordHash){
    alert('Неверный пароль');
    return;
  }

  // Принудительный админ для ADMIN_EMAIL
  if (email === ADMIN_EMAIL.toLowerCase() && user.role !== 'admin') user.role = 'admin';

  ensureStudent(user, user.name);
  saveData();

  state.user = user;
  state.studentId = user.studentId;
  localStorage.setItem(LS.session, user.uid);
  enterApp();
}

  document.getElementById('authScreen').style.display = 'flex';

}

// Скачивание invite-<email>.html — копия приложения с вшитым приглашением
async function downloadInvite(email, role){
  let html = '';
  try{
    const r = await fetch(location.pathname + '?_=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('fetch');
    html = await r.text();
  }catch(e){
    html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  }
  const inject = '<script>window.__APP_INVITE=' + JSON.stringify({ email: email, role: role }) + ';<\/script>';
  if (html.indexOf('</head>') >= 0) html = html.replace('</head>', inject + '\n</head>');
  else html = inject + html;

  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'invite-' + email.replace(/[^a-z0-9@._-]/gi,'_') + '.html';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

// Сортировка оценок по дате (сначала новые — нет, по возрастанию даты)
function sortedGrades(subj){
  return (subj.grades || []).slice().sort((a,b) => String(a.date||'').localeCompare(String(b.date||'')));
}

function renderGrades(){
  const st = currentStudent();
  if (!st) return '<div class="panel"><p class="muted">Ученик не выбран.</p></div>';

  const subjects = st.subjects || [];
  const maxG = Math.max(1, ...subjects.map(s => (s.grades || []).length));
  const avg = overallAvg(st);

  let toolbar = '<div class="grades-toolbar">';
  if (isAdmin()) toolbar += '<button class="btn primary" onclick="App.openAddSubject()">+ Предмет</button>';
  toolbar += '<button class="btn" onclick="App.printGrades()">🖨 Печать</button>';
  toolbar += '<button class="btn" onclick="App.exportPDF()">📄 PDF</button>';
  if (isAdmin()) toolbar += '<button class="btn ok" onclick="App.quickPublish()">📤</button>';
  toolbar += '</div>';

  if (!subjects.length){
    return toolbar + '<div class="panel"><p class="muted">Пока нет ни одного предмета. ' +
      (isAdmin() ? 'Нажмите «+ Предмет», чтобы добавить.' : '') + '</p></div>';
  }

  // ---------- Таблица (ПК) ----------
  let head = '<tr><th class="subj-col">Предмет</th>';
  for (let i = 0; i < maxG; i++) head += '<th class="num-col">' + (i+1) + '</th>';
  head += '</tr>';

  let rows = '';
  subjects.forEach(subj => {
    const a = subjectAvg(subj);
    const gl = sortedGrades(subj);
    rows += '<tr>';
    rows += '<td class="subj-col"><div class="subj-name">' + esc(subj.name) + '</div><div class="subj-meta">' +
      (a != null ? '<span class="avg-mini" style="color:' + avgColor(a) + '">' + a.toFixed(2) + '</span>' : '') +
      (isAdmin() ? '<button class="del-x" title="Удалить предмет" onclick="App.deleteSubject(\'' + subj.id + '\')">✕</button>' : '') +
      '</div></td>';
    for (let i = 0; i < maxG; i++){
      const g = gl[i];
      rows += '<td class="gcell">' + (g ? gradeCellHtml(subj.id, g) : emptyCellHtml(subj.id)) + '</td>';
    }
    rows += '</tr>';
  });

  const table = '<div class="panel" style="padding:12px;overflow-x:auto">' +
    '<table class="grades-table"><thead>' + head + '</thead><tbody>' + rows + '</tbody></table></div>';

  // ---------- Карточки (мобильный) ----------
  let cards = '<div class="grades-cards">';
  subjects.forEach(subj => {
    const a = subjectAvg(subj);
    const gl = sortedGrades(subj);
    cards += '<div class="gcard"><div class="gcard-head">' +
      '<div><div class="subj-name">' + esc(subj.name) + '</div>' +
      (a != null ? '<div class="avg-mini" style="color:' + avgColor(a) + '">средний: ' + a.toFixed(2) + '</div>' : '') +
      '</div>' +
      (isAdmin() ? '<button class="del-x" onclick="App.deleteSubject(\'' + subj.id + '\')">✕</button>' : '') +
      '</div><div class="gcard-list">' +
      gl.map(g => gradeCellHtml(subj.id, g)).join('') +
      emptyCellHtml(subj.id) +
      '</div></div>';
  });
  cards += '</div>';

  return toolbar + table + cards;
}

function renderSchedule(){
  const st = currentStudent();
  if (!st) return '<div class="panel"><p class="muted">Ученик не выбран.</p></div>';
  const editable = canEdit();

  let html = '<div class="grades-toolbar">' +
    '<button class="btn" onclick="App.printSchedule()">🖨 Печать</button>' +
    '</div><div class="sched-grid">';

  DAYS.forEach(day => {
    const lessons = (st.schedule || []).filter(l => l.day === day);
    html += '<div class="sched-col" data-day="' + esc(day) + '" ' +
      'ondragover="App.onDragOver(event)" ondragleave="App.onDragLeave(event)" ' +
      'ondrop="App.onDrop(event,\'' + day + '\')">' +
      '<div class="sched-head">' + esc(day) + '</div><div class="sched-body">';

    lessons.forEach(l => {
      html += '<div class="lesson-card" draggable="' + (editable ? 'true' : 'false') + '" data-lesson="' + esc(l.id) + '" ' +
        'ondragstart="App.onDragStart(event,\'' + l.id + '\')" ondragend="App.onDragEnd(event)" ' +
        'onclick="App.openLesson(\'' + l.id + '\')">' +
        '<div class="lesson-subj">' + esc(l.subject || '—') + '</div>' +
        (l.time ? '<div class="lesson-time">' + esc(l.time) + '</div>' : '') +
        (l.room ? '<div class="lesson-room">· каб. ' + esc(l.room) + '</div>' : '') +
        (l.homework ? '<div class="lesson-hw">' + esc(l.homework) + '</div>' : '') +
        '</div>';
    });

    if (editable){
      html += '<button class="btn ghost add-lesson" onclick="App.openLesson(\'\',\'' + day + '\')">+ Урок</button>';
    }
    html += '</div></div>';
  });

  html += '</div>';
  return html;
}

      '<div style="display:flex;flex-direction:column;gap:8px">' +
      '<button class="btn primary" onclick="App.publish()">📤 Опубликовать</button>' +

    '<button class="btn" onclick="App.exportJSON()">⬇ Экспорт JSON</button>' +
    (isAdmin() ? '<button class="btn" onclick="App.importJSON()">⬆ Импорт JSON</button>' : '') +
    (isAdmin() ? '<button class="btn danger" onclick="App.resetAll()">🗑 Сбросить всё</button>' : '') +

    '<input type="file" id="importFile" accept="application/json,.json" style="display:none">' +
    '</div>';

  // ---------- ПРАВАЯ КОЛОНКА ----------
  let right = '';

  const cat = (st && st.catalog) ? st.catalog : DEFAULT_CATALOG;
  right += '<div class="panel"><h3>📚 Каталог предметов</h3><div class="chips">' +
    (cat.length
      ? cat.map(c => '<span class="pill">' + esc(c) +
          (canEdit() ? '<button class="x" title="Удалить" onclick="App.removeCatalog(\'' + esc(c).replace(/'/g,'&#39;') + '\')">✕</button>' : '') +
          '</span>').join('')
      : '<span class="muted small">Каталог пуст</span>') +
    '</div>';
  if (canEdit()){
    right += '<div class="inline-form">' +
      '<input id="catInput" type="text" placeholder="Новый предмет">' +
      '<button class="btn primary" onclick="App.addCatalog()">Добавить</button>' +
      '</div>';
  }
  right += '</div>';

  // Статистика по предметам
  const stats = (st ? (st.subjects || []) : [])
    .map(s => ({ name: s.name, avg: subjectAvg(s), count: (s.grades || []).length }))

        '</div>';
    });

  right += '</div>';

  // Заявки (только админ, и только если они есть)
  if (isAdmin() && pendingCache.length){
    const filtered = pendingCache.filter(r => {
      if (pendingFilter === 'users')   return r.type === 'new_user' || r.type === 'new_student' || r.type === 'password_reset';
      if (pendingFilter === 'grades')  return r.type === 'grade' || r.type === 'schedule';
      return true;
    });

    right += '<div class="panel"><h3>🔔 Заявки: ' + pendingCache.length +
      ' <button class="btn small ghost" style="margin-left:auto" onclick="App.refreshPending()">🔄 Обновить</button></h3>' +
      '<div class="req-filters">' +
      '<button class="btn small ' + (pendingFilter==='all'?'primary':'') + '" onclick="App.setPendingFilter(\'all\')">Все</button>' +
      '<button class="btn small ' + (pendingFilter==='users'?'primary':'') + '" onclick="App.setPendingFilter(\'users\')">👤 Пользователи</button>' +
      '<button class="btn small ' + (pendingFilter==='grades'?'primary':'') + '" onclick="App.setPendingFilter(\'grades\')">📝 Оценки</button>' +
      '</div>';

    if (!filtered.length){
      right += '<p class="muted small">Нет заявок в этой категории.</p>';
    }else{
      filtered.forEach(r => {
        right += '<div class="req-card">' +
          '<div class="req-top">' +
          '<span class="req-type">' + esc(reqTypeLabel(r.type)) + '</span>' +
          '<span class="muted small">' + esc(fmtDateTime(r.timestamp)) + '</span>' +
          '</div>' +
          '<div class="req-desc">' + esc(pendingDescription(r)) + '</div>' +
          '<div class="req-actions">' +
          '<button class="btn small ok" onclick="App.approve(\'' + r.id + '\')">✅ Принять</button>' +
          '<button class="btn small danger" onclick="App.reject(\'' + r.id + '\')">✖ Отклонить</button>' +
          '</div></div>';
      });
    }
    right += '</div>';
  }

  // Приглашения (только админ)
  if (isAdmin()){
    const invites = getInvites();
    right += '<div class="panel"><h3>✉ Приглашение участников</h3>' +
      '<div class="field"><label>Email</label><input id="invEmail" type="email" placeholder="user@example.com"></div>' +
      '<div class="field"><label>Роль</label><select id="invRole">' +
      '<option value="viewer">Наблюдатель</option>' +

      '<option value="admin">Администратор</option>' +
      '</select></div>' +

          '<button class="btn small" onclick="App.downloadInvite(\'' + esc(inv.email) + '\',\'' + inv.role + '\')">📥 Скачать</button>' +
          '<button class="btn small danger" onclick="App.removeInvite(\'' + esc(inv.email) + '\')">×</button>' +
          '</div>';
      });
      right += '</div>';
    }
    right += '</div>';
  }

  return '<div class="profile-grid"><div>' + left + '</div><div>' + right + '</div></div>';
}

function reqTypeLabel(t){
  switch(t){
    case 'grade':          return 'ОЦЕНКА';
    case 'schedule':       return 'РАСПИСАНИЕ';
    case 'new_student':    return 'УЧЕНИК';
    case 'new_user':       return 'ПОЛЬЗОВАТЕЛЬ';
    case 'password_reset': return 'ПАРОЛЬ';
    default:               return 'ЗАЯВКА';
  }
}

function pendingDescription(r){
  switch(r.type){
    case 'grade':
      return r.action === 'delete'
        ? 'Удалить оценку по предмету «' + (r.subjectName||'') + '»'
        : (r.action === 'update' ? 'Изменить' : 'Добавить') + ' оценку ' + (r.grade ? r.grade.value : '') +
          ' по предмету «' + (r.subjectName||'') + '»' + (r.grade && r.grade.type ? ' (' + r.grade.type + ')' : '');
    case 'schedule':
      return r.action === 'delete'
        ? 'Удалить урок: ' + ((r.lesson && r.lesson.subject) || '')
        : (r.action === 'update' ? 'Изменить' : 'Добавить') + ' урок: ' +
          ((r.lesson && r.lesson.subject) || '') + ' — ' + ((r.lesson && r.lesson.day) || '');
    case 'new_student':    return 'Регистрация ученика: ' + (r.studentName || '');
    case 'new_user':       return 'Регистрация пользователя: ' + ((r.user && r.user.email) || '') +
                                  ' (роль: ' + roleLabel((r.user && r.user.role) || 'viewer') + ')';
    case 'password_reset': return 'Сброс пароля для ' + ((r.user && r.user.email) || '');
    default:               return 'Заявка';
  }
}

let gradeModalCtx = null;

function openGradeModal(subjId, gradeId){
  const st = currentStudent();
  if (!st) return;
  const subj = (st.subjects || []).find(s => s.id === subjId);
  if (!subj) return;
  const g = gradeId ? (subj.grades || []).find(x => x.id === gradeId) : null;

  gradeModalCtx = { subjId: subjId, gradeId: gradeId || null };

  const values = [];
  for (let i = 1; i <= 10; i++) values.push(i);

  openModal(
    '<h3>' + (g ? 'Оценка' : 'Новая оценка') + ' · ' + esc(subj.name) + '</h3>' +
    '<div class="field"><label>Оценка</label><select id="gmValue">' +
      values.map(v => '<option value="' + v + '"' + (g && Number(g.value) === v ? ' selected' : '') + '>' + v + '</option>').join('') +
    '</select></div>' +
    '<div class="field"><label>Тип работы</label><select id="gmType">' +
      WORK_TYPES.map(t => '<option value="' + esc(t.name) + '"' + (g && g.type === t.name ? ' selected' : '') +
        ((!g && t.name === 'Ответ на уроке') ? ' selected' : '') + '>' + esc(t.name) + '</option>').join('') +
    '</select></div>' +
    '<div class="field"><label>Дата</label><input id="gmDate" type="date" value="' + esc((g && g.date) || todayISO()) + '"></div>' +
    '<div class="field"><label>Описание</label><textarea id="gmComment" rows="3" placeholder="Комментарий…">' + esc((g && g.comment) || '') + '</textarea></div>' +
    '<div class="modal-actions">' +
      (g ? '<button class="btn danger" onclick="App.deleteGrade()">Удалить</button>' : '') +
      '<button class="btn" onclick="App.closeModal()">Отмена</button>' +
      '<button class="btn primary" onclick="App.saveGrade()">Сохранить</button>' +
    '</div>'
  );
}

async function saveGrade(){
  const ctx = gradeModalCtx;
  if (!ctx) return;
  const st = currentStudent();
  if (!st) return;

  const value   = Number(document.getElementById('gmValue').value);
  const type    = document.getElementById('gmType').value;
  const date    = document.getElementById('gmDate').value;
  const comment = document.getElementById('gmComment').value;

  let subj = (st.subjects || []).find(s => s.id === ctx.subjId);
  if (!subj){
    subj = { id: ctx.subjId, name: 'Предмет', grades: [] };
    st.subjects.push(subj);
  }
  subj.grades = subj.grades || [];

  const gData = { value: value, type: type, date: date, comment: comment };
  const action = ctx.gradeId ? 'update' : 'add';
  const gradeId = ctx.gradeId || uid();

  if (isAdmin()){
    // Админ — прямое изменение + автопубликация
    if (action === 'update'){
      const g = subj.grades.find(x => x.id === gradeId);
      if (g) Object.assign(g, gData);
      else subj.grades.push(Object.assign({ id: gradeId }, gData));
    }else{
      subj.grades.push(Object.assign({ id: gradeId }, gData));
    }
    saveData();
    closeModal();
    renderAll();
    publishToGitHubSilent();
    toast('✅ Оценка сохранена');
  }else{
    // Ученик — локально + заявка админу
    if (action === 'update'){
      const g = subj.grades.find(x => x.id === gradeId);
      if (g) Object.assign(g, gData);
      else subj.grades.push(Object.assign({ id: gradeId }, gData));
    }else{
      subj.grades.push(Object.assign({ id: gradeId }, gData));
    }
    saveData();
    closeModal();
    renderAll();
    const ok = await sendPending({
      type: 'grade', action: action,
      studentEmail: state.user.email, studentName: state.user.name, studentId: st.id,
      subjectId: subj.id, subjectName: subj.name,
      gradeId: gradeId, grade: gData
    });
    alert(ok ? '📤 Заявка отправлена администратору' : '⚠ Не удалось отправить заявку (нет сети)');
  }
}

async function deleteGrade(){
  const ctx = gradeModalCtx;
  if (!ctx || !ctx.gradeId) return;
  if (!confirm('Удалить оценку?')) return;

  const st = currentStudent();
  if (!st) return;
  const subj = (st.subjects || []).find(s => s.id === ctx.subjId);
  if (!subj) return;

  subj.grades = (subj.grades || []).filter(g => g.id !== ctx.gradeId);

  if (isAdmin()){
    saveData();
    closeModal();
    renderAll();
    publishToGitHubSilent();
    toast('Оценка удалена');
  }else{
    saveData();
    closeModal();
    renderAll();
    const ok = await sendPending({
      type: 'grade', action: 'delete',
      studentEmail: state.user.email, studentName: state.user.name, studentId: st.id,
      subjectId: subj.id, subjectName: subj.name,
      gradeId: ctx.gradeId
    });
    alert(ok ? '📤 Заявка отправлена администратору' : '⚠ Не удалось отправить заявку');
  }
}

// Добавление предмета (из каталога или вручную)
function openAddSubjectModal(){
  const st = currentStudent();

async function saveLesson(){
  const ctx = lessonModalCtx;
  if (!ctx) return;
  const st = currentStudent();
  if (!st || !canEdit()) return;

  const lesson = {
    day:      document.getElementById('lmDay').value,
    subject:  document.getElementById('lmSubject').value,
    time:     document.getElementById('lmTime').value.trim(),
    room:     document.getElementById('lmRoom').value.trim(),
    homework: document.getElementById('lmHw').value
  };

  st.schedule = st.schedule || [];
  const action = ctx.lessonId ? 'update' : 'add';
  const lessonId = ctx.lessonId || uid();

  if (action === 'update'){
    const idx = st.schedule.findIndex(x => x.id === lessonId);
    if (idx >= 0) st.schedule[idx] = Object.assign({}, st.schedule[idx], lesson);
    else st.schedule.push(Object.assign({ id: lessonId }, lesson));
  }else{
    st.schedule.push(Object.assign({ id: lessonId }, lesson));
  }

  saveData();
  closeModal();
  renderAll();

  if (isAdmin()){
    publishToGitHubSilent();
    toast('✅ Урок сохранён');
  }else{
    const ok = await sendPending({
      type: 'schedule', action: action,
      studentEmail: state.user.email, studentName: state.user.name, studentId: st.id,
      lessonId: lessonId, lesson: lesson
    });
    alert(ok ? '📤 Заявка отправлена администратору' : '⚠ Не удалось отправить заявку');
  }
}

async function deleteLesson(){
  const ctx = lessonModalCtx;
  if (!ctx || !ctx.lessonId) return;

  st.schedule = (st.schedule || []).filter(l => l.id !== ctx.lessonId);

    });

  }
}

/* --- Drag & Drop расписания --- */

let dragLessonId = null;

function onDragStart(ev, lessonId){
  if (!canEdit()) return;
  dragLessonId = lessonId;
  ev.dataTransfer.effectAllowed = 'move';
  try{ ev.dataTransfer.setData('text/plain', lessonId); }catch(e){}
  ev.currentTarget.classList.add('dragging');
}

function onDragEnd(ev){
  dragLessonId = null;
  document.querySelectorAll('.lesson-card.dragging').forEach(el => el.classList.remove('dragging'));
  document.querySelectorAll('.sched-col.dragover').forEach(el => el.classList.remove('dragover'));
}

function onDragOver(ev){
  if (!canEdit() || !dragLessonId) return;
  ev.preventDefault();
  ev.dataTransfer.dropEffect = 'move';
  ev.currentTarget.classList.add('dragover');
}

function onDragLeave(ev){
  ev.currentTarget.classList.remove('dragover');
}

async function onDrop(ev, day){
  ev.preventDefault();
  const col = ev.currentTarget;
  col.classList.remove('dragover');
  if (!canEdit() || !dragLessonId) return;

  const st = currentStudent();
  if (!st) return;

  const id = dragLessonId;
  const lesson = (st.schedule || []).find(l => l.id === id);
  if (!lesson) return;

  // Определяем позицию вставки по координате Y
  const cards = [...col.querySelectorAll('.lesson-card')].filter(c => c.dataset.lesson !== id);
  let index = cards.length;
  for (let i = 0; i < cards.length; i++){
    const r = cards[i].getBoundingClientRect();
    if (ev.clientY < r.top + r.height / 2){ index = i; break; }
  }

  // Убираем урок из массива
  st.schedule = (st.schedule || []).filter(l => l.id !== id);
  lesson.day = day;

  // Соседи в целевом дне
  const dayLessons = st.schedule.filter(l => l.day === day);
  const target = dayLessons[index];

  if (target){
    const pos = st.schedule.indexOf(target);
    st.schedule.splice(pos, 0, lesson);
  }else{
    const last = dayLessons[dayLessons.length - 1];
    if (last) st.schedule.splice(st.schedule.indexOf(last) + 1, 0, lesson);
    else st.schedule.push(lesson);
  }

  dragLessonId = null;
  saveData();
  renderAll();

  if (isAdmin()){
    publishToGitHubSilent();
  }else{
    await sendPending({
      type: 'schedule', action: 'update',
      studentEmail: state.user.email, studentName: state.user.name, studentId: st.id,
      lessonId: lesson.id, lesson: lesson
    });
    toast('📤 Перемещение отправлено на одобрение');
  }
}

async function deleteUser(email){

  const u = findUserByEmail(email);

  if (state.user && u.uid === state.user.uid){ alert('Нельзя удалить себя'); return; }

  const admins = (data.users || []).filter(x => x.role === 'admin');
  if (u.role === 'admin' && admins.length <= 1){ alert('Нельзя удалить последнего администратора'); return; }

  if (!confirm('Удалить пользователя ' + email + '? Он больше никогда не сможет войти.')) return;

  // Чёрный список — навсегда
  data.deletedEmails = data.deletedEmails || [];
  if (!data.deletedEmails.some(e => String(e).toLowerCase() === email.toLowerCase())){
    data.deletedEmails.push(email);
  }
  data.users = (data.users || []).filter(x => x.uid !== u.uid);

  saveData();
  renderAll();
  await publishToGitHubSilent();
  toast('Пользователь удалён');
}

function buildPrintTable(st){
  const subjects = st.subjects || [];
  let rows = '';
  subjects.forEach(subj => {
    const a = subjectAvg(subj);
    const gl = sortedGrades(subj);
    rows += '<tr><td><b>' + esc(subj.name) + '</b></td>' +
      '<td>' + gl.map(g => esc(g.value) + (typeShort(g.type) ? ' (' + typeShort(g.type) + ')' : '') +
        (g.date ? ' ' + fmtDate(g.date) : '')).join('; ') + '</td>' +
      '<td>' + (a != null ? a.toFixed(2) : '—') + '</td></tr>';
  });
  return '<table><thead><tr><th>Предмет</th><th>Оценки</th><th>Ср. балл</th></tr></thead><tbody>' +
    rows + '</tbody></table>';
}

function printGrades(){

function printSchedule(){
  const st = currentStudent();
  if (!st) return;
  let html = '<h2>Расписание уроков</h2><div class="p-sub">' + esc(st.studentName) + ' · ' +
    fmtDate(new Date().toISOString()) + '</div><table><thead><tr>';
  DAYS.forEach(d => { html += '<th>' + d + '</th>'; });
  html += '</tr></thead><tbody><tr>';
  DAYS.forEach(d => {
    const lessons = (st.schedule || []).filter(l => l.day === d);
    html += '<td>' + (lessons.length
      ? lessons.map(l => '<b>' + esc(l.subject) + '</b>' + (l.time ? '<br>' + esc(l.time) : '') +
          (l.room ? '<br>каб. ' + esc(l.room) : '') + (l.homework ? '<br><i>' + esc(l.homework) + '</i>' : ''))
        .join('<hr style="border:none;border-top:1px solid #ccc;margin:4px 0">')
      : '—') + '</td>';
  });
  html += '</tr></tbody></table>';

  const area = document.getElementById('printArea');

function exportPDF(){
  const st = currentStudent();
  if (!st) return;
  if (typeof html2pdf === 'undefined'){
    alert('Библиотека html2pdf.js не загружена. Проверьте интернет-соединение.');
    return;
  }

  const avg = overallAvg(st);
  const subjects = st.subjects || [];

  let rows = '';
  subjects.forEach(subj => {
    const a = subjectAvg(subj);
    const gl = sortedGrades(subj);
    rows += '<tr><td>' + esc(subj.name) + '</td><td>' +
      (gl.map(g => '<span class="pdf-chip" style="background:' + gradeColor(g.value) + '">' +
        esc(g.value) + '</span>').join(' ')) + '</td>' +
      '<td style="text-align:center;font-weight:700;color:' + (a != null ? avgColor(a) : '#333') + '">' +
      (a != null ? a.toFixed(2) : '—') + '</td></tr>';
  });

  const el = document.createElement('div');
  el.className = 'pdf-doc';
  el.innerHTML =
    '<h2>Ведомость оценок</h2>' +
    '<div class="pdf-sub">' + esc(st.studentName) + ' · ' + fmtDate(new Date().toISOString()) +
    ' · средний балл: ' + (avg != null ? avg.toFixed(2) : '—') + '</div>' +
    '<table><thead><tr><th style="width:40%">Предмет</th><th>Оценки</th><th style="width:15%;text-align:center">Ср. балл</th></tr></thead>' +
    '<tbody>' + (rows || '<tr><td colspan="3">Нет данных</td></tr>') + '</tbody></table>';

  el.style.position = 'fixed';
  el.style.left = '-10000px';
  el.style.top = '0';
  document.body.appendChild(el);

  const fileName = 'tabel-' + String(st.studentName).replace(/\s+/g,'_') + '-' + todayISO() + '.pdf';

  html2pdf().set({
    margin: 10,
    filename: fileName,
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
  }).from(el).save().then(() => {
    el.remove();
    toast('📄 PDF готов');
  }).catch(e => {
    el.remove();
    alert('Ошибка генерации PDF: ' + e.message);
  });
}

function applyTheme(){

  const btn = document.getElementById('themeBtn');
  if (btn) btn.textContent = t === 'dark' ? '☀️' : '🌙';

function toggleTheme(){

  const next = cur === 'dark' ? 'light' : 'dark';
  localStorage.setItem(LS.theme, next);
  applyTheme();
}

// Проверка приглашения (window.__APP_INVITE)
function applyInviteFromWindow(){
  try{
    if (window.__APP_INVITE && window.__APP_INVITE.email){
      setAuthMode('register');
      document.getElementById('authEmail').value = window.__APP_INVITE.email;
      // Сохраняем приглашение локально, если его ещё нет
      const invites = getInvites();
      if (!invites.some(i => i.email === window.__APP_INVITE.email)){
        invites.push({
          email: window.__APP_INVITE.email,
          role: window.__APP_INVITE.role || 'viewer',
          createdAt: new Date().toISOString()
        });
        localStorage.setItem(LS.invites, JSON.stringify(invites));
      }
      toast('✉ Приглашение: ' + roleLabel(window.__APP_INVITE.role || 'viewer'));
    }
  }catch(e){}
}

async function boot(){
  applyTheme();
  loadLocal();

  // Пробуем подтянуть свежие данные с GitHub Pages
  try{
    const remote = await loadPublishedData();
    mergeRemote(remote);
    saveData();
  }catch(e){
    console.warn('data.json недоступен, работаем из локального кэша');
  }

  // Восстанавливаем сессию
  const sessUid = localStorage.getItem(LS.session);
  if (sessUid){
    let user = (data.users || []).find(u => u.uid === sessUid);
    if (user && isDeletedEmail(user.email)) user = null;

    if (user){
      if (user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) user.role = 'admin';
      state.user = user;
      const st = ensureStudent(user, user.name);
      state.studentId = st.id;
      saveData();
      enterApp();
      return;
    }else{
      localStorage.removeItem(LS.session);
    }
  }

  // Нет сессии — показываем экран входа
  document.getElementById('authScreen').style.display = 'flex';
  document.getElementById('appScreen').style.display = 'none';
  applyInviteFromWindow();
}

  renderAll();
});

// Enter в полях авторизации
document.getElementById('authPass').addEventListener('keydown', e => {
  if (e.key === 'Enter'){ authMode === 'register' ? startRegistration() : doLogin(); }
});
document.getElementById('authEmail').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('authPass').focus();
});

/* ============================================================================
   27. ПУБЛИЧНЫЙ API ДЛЯ inline-обработчиков
   ============================================================================ */

window.App = {
  // модальные окна
  closeModal: closeModal,

  // оценки
  openGrade: (subjId, gradeId) => { if (canEdit()) openGradeModal(subjId, gradeId); },
  saveGrade: saveGrade,
  deleteGrade: deleteGrade,
  openAddSubject: openAddSubjectModal,
  addSubject: addSubject,
  deleteSubject: deleteSubject,

  // расписание
  openLesson: (lessonId, day) => { if (canEdit()) openLessonModal(lessonId, day); },
  saveLesson: saveLesson,
  deleteLesson: deleteLesson,
  onDragStart: onDragStart,
  onDragEnd: onDragEnd,
  onDragOver: onDragOver,
  onDragLeave: onDragLeave,
  onDrop: onDrop,

  // печать / PDF / публикация
  printGrades: printGrades,
  printSchedule: printSchedule,
  exportPDF: exportPDF,
  quickPublish: quickPublish,

  // ЛК
  saveStudentName: saveStudentName,
  addCatalog: addCatalog,
  removeCatalog: removeCatalog,
  exportJSON: exportJSON,
  importJSON: importJSON,
  resetAll: resetAll,
  publish: publishToGitHub,
  sync: syncFromGitHub,
  forgetToken: forgetToken,

  // приглашения
  addInvite: addInvite,
  removeInvite: removeInvite,
  downloadInvite: downloadInvite,

  // пользователи
  changeRole: changeRole,
  deleteUser: deleteUser,

  // заявки
  approve: approvePending,
  reject: rejectPending,
  refreshPending: () => { pollPending(true).then(() => toast('🔄 Обновлено')); },
  setPendingFilter: (f) => { pendingFilter = f; renderView(); }
};

/* ============================================================================
   28. СТАРТ
   ============================================================================ */

window.addEventListener('load', () => {
  applyTheme();
  boot();
});

// Закрытие подсказки при скролле
window.addEventListener('scroll', hideTooltip, { passive: true });
window.addEventListener('resize', hideTooltip);
</script>
